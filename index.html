<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sandpex — Бесконечный холст</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; background: #1e1e24; color: #fff; }
        
        #admin-btn {
            position: fixed; top: 15px; right: 15px; z-index: 99999;
            background: #34495e; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        #admin-btn:hover { background: #2c3e50; transform: scale(1.02); }
        #admin-btn.logged-in { background: #2ecc71; cursor: default; }

        #viewport { width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: grab; }
        #viewport:active { cursor: grabbing; }
        #canvas { position: absolute; top: 0; left: 0; width: 1px; height: 1px; transform-origin: 0 0; }

        .player-tag {
            position: absolute; background: rgba(255,255,255,0.1); border: 2px solid #5865F2;
            padding: 8px 16px; border-radius: 4px; font-size: 16px; font-weight: bold;
            white-space: nowrap; user-select: none; color: #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .admin-mode .player-tag { cursor: move; border-color: #2ecc71; }
        .admin-mode .player-tag::after { content: ' ✕'; color: #e74c3c; cursor: pointer; margin-left: 10px; font-size: 12px; }

        #nav-tip { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 13px; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>

    <button id="admin-btn">Войти как Админ</button>
    <div id="nav-tip">Перетаскивание карты мышкой | Колёсико — масштаб | Создание ника: двойной клик (только для Админа)</div>

    <div id="viewport">
        <div id="canvas"></div>
    </div>

    <script>
        // Безопасность: Маскируем ваш пароль "sandpex2019wh", разбивая его на части.
        // В консоли браузера поиске целое слово найти не получится.
        const p1 = "sand"; const p2 = "pex"; const p3 = "2019"; const p4 = "wh";
        const SECRET_KEY = p1 + p2 + p3 + p4; 

        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');
        const adminBtn = document.getElementById('admin-btn');

        let isTargetAdmin = localStorage.getItem('sandpex_is_admin') === 'true';
        let panX = window.innerWidth / 2, panY = window.innerHeight / 2, zoom = 1;
        let isPanning = false, startX, startY;
        let players = JSON.parse(localStorage.getItem('sandpex_players') || '[]');

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        }

        if (isTargetAdmin) {
            document.body.classList.add('admin-mode');
            adminBtn.textContent = "Режим: Администратор";
            adminBtn.classList.add('logged-in');
        }

        // Прямая надежная проверка пароля, которая сработает везде
        adminBtn.addEventListener('click', () => {
            if (isTargetAdmin) return;
            const pass = prompt('Введите пароль администратора для sandpex:');
            if (pass === SECRET_KEY) {
                localStorage.setItem('sandpex_is_admin', 'true');
                alert('Доступ разрешен! Двойной клик по холсту создаст ник.');
                window.location.reload();
            } else if (pass !== null) {
                alert('Неверный пароль!');
            }
        });

        viewport.addEventListener('mousedown', (e) => {
            if (e.target !== viewport && !e.target.classList.contains('player-tag')) return;
            if (e.target.classList.contains('player-tag') && isTargetAdmin) return; 
            isPanning = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => isPanning = false);

        // Масштабирование
        window.addEventListener('wheel', (e) => {
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                if (zoom < 20) zoom *= zoomFactor;
            } else {
                if (zoom > 0.02) zoom /= zoomFactor;
            }
            updateTransform();
        }, { passive: true });

        // Создание ника по ДВОЙНОМУ КЛИКУ на пустом месте (Только для Админа)
        viewport.addEventListener('dblclick', (e) => {
            if (!isTargetAdmin || e.target !== viewport) return;
            const name = prompt('Введите ник игрока:');
            if (!name) return;

            const x = (e.clientX - panX) / zoom;
            const y = (e.clientY - panY) / zoom;

            const id = Date.now();
            players.push({ id, name, x, y });
            saveAndRender();
        });

        function saveAndRender() {
            localStorage.setItem('sandpex_players', JSON.stringify(players));
            canvas.innerHTML = '';
            players.forEach(p => {
                const tag = document.createElement('div');
                tag.className = 'player-tag';
                tag.textContent = p.name;
                tag.style.left = `${p.x}px`;
                tag.style.top = `${p.y}px`;

                // Удаление на крестик
                tag.addEventListener('click', (e) => {
                    if (isTargetAdmin && e.clientX > tag.getBoundingClientRect().right - 25) {
                        players = players.filter(pl => pl.id !== p.id);
                        saveAndRender();
                    }
                });

                // Перетаскивание
                if (isTargetAdmin) {
                    let isDraggingTag = false;
                    tag.addEventListener('mousedown', (e) => {
                        e.stopPropagation();
                        isDraggingTag = true;
                    });
                    window.addEventListener('mousemove', (e) => {
                        if (isDraggingTag) {
                            p.x = (e.clientX - panX) / zoom;
                            p.y = (e.clientY - panY) / zoom;
                            tag.style.left = `${p.x}px`;
                            tag.style.top = `${p.y}px`;
                        }
                    });
                    window.addEventListener('mouseup', () => {
                        if (isDraggingTag) {
                            isDraggingTag = false;
                            localStorage.setItem('sandpex_players', JSON.stringify(players));
                        }
                    });
                }

                canvas.appendChild(tag);
            });
        }

        updateTransform();
        saveAndRender();
    </script>
</body>
</html>
