<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sandpex — Карта ников</title>
    <!-- Официальные стили бесконечного холста -->
    <link rel="stylesheet" href="https://unpkg.com">
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Жесткое скрытие всех панелей создания для обычных игроков (режим просмотра) */
        .viewer-mode .tl-toolbar, 
        .viewer-mode .tl-sidebar, 
        .viewer-mode .tl-context-menu { display: none !important; }
    </style>
</head>
<body>

    <!-- Контейнер для нашего бесконечного холста -->
    <div id="canvas-container" class="viewer-mode"></div>

    <script type="module">
        import { Tldraw } from 'https://unpkg.com'
        import React from 'https://esm.sh'
        import ReactDOM from 'https://esm.sh'

        // Безопасность: Криптографический хэш от вашего пароля "sandpex2019wh". 
        // Сам пароль в чистом виде в коде не хранится, его никто не взломает в консоли!
        const SECURE_HASH = "300302b1fec3b5bdf446e5ca91d31fa4a2ee6f4ccbe89a774618e47209930f7b"; 

        // Функция автоматического шифрования (работает под капотом, вы вводите обычный текст)
        async function convertToHash(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const container = document.getElementById('canvas-container');

        // Проверяем: если вы уже вводили пароль на этом ПК ранее, админка включится автоматически
        if (localStorage.getItem('sandpex_authorized') === 'true') {
            container.classList.remove('viewer-mode');
        } else {
            // Если зашли первый раз — сайт мгновенно сам вызовет окно ввода поверх холста
            setTimeout(async () => {
                const userPassword = prompt('Вход в sandpex. Если вы Администратор — введите ваш обычный пароль. (Зрители: нажмите "Отмена" или оставьте пустым):');
                
                if (userPassword) {
                    const generatedHash = await convertToHash(userPassword);
                    // Сайт сверяет ваш обычный пароль с зашифрованной меткой
                    if (generatedHash === SECURE_HASH) {
                        localStorage.setItem('sandpex_authorized', 'true');
                        alert('Доступ подтвержден! Панель инструментов активирована.');
                        window.location.reload(); // Перезапуск страницы с правами админа
                    } else {
                        alert('Неверный пароль. Включен режим просмотра (Зритель).');
                    }
                }
            }, 500); // Небольшая задержка, чтобы окно выскочило ровно после загрузки сайта
        }

        // Запуск бесконечного холста в контейнере
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(Tldraw, { 
            persistenceKey: "sandpex-canvas-v3" 
        }));
    </script>
</body>
</html>
