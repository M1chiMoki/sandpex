<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>sandpex — Карта ников</title><style>
*{box-sizing:border-box;}body,html{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;font-family:sans-serif;background:#fff;color:#000;}
#ui-container{position:fixed;top:15px;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:99999;pointer-events:none;}
.ui-element{pointer-events:auto;}#search-box{padding:10px 15px;width:250px;border:2px solid #000;border-radius:6px;font-size:14px;outline:none;background:#fff;color:#000;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
#admin-btn,#save-btn{background:#000;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,0.1);transition:0.2s;margin-left:10px;}
#admin-btn:hover,#save-btn:hover{background:#333;}#admin-btn.logged-in{background:#2ecc71;color:#fff;cursor:default;}#save-btn{display:none;background:#2f80ed;color:#fff;}
#viewport{width:100%;height:100%;position:absolute;top:0;left:0;cursor:grab;}#viewport:active{cursor:grabbing;}#canvas{position:absolute;top:0;left:0;width:1px;height:1px;transform-origin:0 0;}
.player-tag{position:absolute;font-size:16px;font-weight:bold;white-space:nowrap;user-select:none;color:#000;}
.admin-mode .player-tag{cursor:move;}.player-delete-btn{display:none;color:#e74c3c;cursor:pointer;margin-left:6px;font-size:14px;font-weight:bold;}.admin-mode .player-delete-btn{display:inline-block;}
#nav-tip{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.05);color:#000;padding:6px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:999;}
</style></head><body><div id="ui-container"><div></div><input type="text" id="search-box" class="ui-element" placeholder="Найти ник на карте..."><div class="ui-element"><button id="save-btn">Скачать файл карты</button><button id="admin-btn">Войти как Admin</button></div></div><div id="nav-tip">Перетаскивание карты мышкой | Колёсико — зум | Двойной клик — создать ник (для Админа)</div><div id="viewport"><div id="canvas"></div></div><script>
const GH_USER="M1chiMoki",GH_REPO="sandpex",SECRET_KEY="sandpex2019wh";
const viewport=document.getElementById("viewport"),canvas=document.getElementById("canvas"),adminBtn=document.getElementById("admin-btn"),saveBtn=document.getElementById("save-btn"),searchBox=document.getElementById("search-box");
let isTargetAdmin=localStorage.getItem("sandpex_is_admin")==="true",panX=window.innerWidth/2,panY=window.innerHeight/2,zoom=1,isPanning=false,startX,startY,players=[];
function updateTransform(){canvas.style.transform="translate("+panX+"px,"+panY+"px) scale("+zoom+")";}
if(isTargetAdmin){document.body.classList.add("admin-mode");adminBtn.textContent="Режим: Администратор";adminBtn.classList.add("logged-in");saveBtn.style.display="inline-block";}
adminBtn.addEventListener("click",()=>{if(isTargetAdmin)return;const p=prompt("Введите пароль администратора для sandpex:");if(p===SECRET_KEY){localStorage.setItem("sandpex_is_admin","true");alert("Доступ разрешен!");window.location.reload();}else if(p!==null){alert("Неверный пароль!");}});

async function loadPlayersFromServer(){try{const r=await fetch("https://githubusercontent.com"+GH_USER+"/"+GH_REPO+"/main/players.json",{cache:"no-store"});if(r.ok){players=await r.json();renderPlayers();}}catch(e){console.log("Ожидание файла players.json в репозитории.");}}

saveBtn.addEventListener("click",()=>{if(!isTargetAdmin)return;const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(players,null,2));const downloadAnchor=document.createElement('a');downloadAnchor.setAttribute("href",dataStr);downloadAnchor.setAttribute("download","players.json");document.body.appendChild(downloadAnchor);downloadAnchor.click();downloadAnchor.remove();alert("Файл 'players.json' успешно скачан! Загрузите его в свой репозиторий sandpex на GitHub через кнопку 'Add file -> Upload files'.");});

searchBox.addEventListener("input",()=>{const q=searchBox.value.trim().toLowerCase();if(!q)return;const f=players.find(p=>p.name.toLowerCase().includes(q));if(f){zoom=1.5;panX=window.innerWidth/2-f.x*zoom;panY=window.innerHeight/2-f.y*zoom;updateTransform();}});
viewport.addEventListener("mousedown",e=>{if(e.target!==viewport&&!e.target.classList.contains("player-tag")&&!e.target.parentNode.classList.contains("player-tag"))return;if((e.target.classList.contains("player-tag")||e.target.parentNode.classList.contains("player-tag"))&&isTargetAdmin)return;isPanning=true;startX=e.clientX-panX;startY=e.clientY-panY;});
window.addEventListener("mousemove",e=>{if(isPanning){panX=e.clientX-startX;panY=e.clientY-startY;updateTransform();}});window.addEventListener("mouseup",()=>isPanning=false);
window.addEventListener("wheel",e=>{const f=1.1;if(e.deltaY<0){if(zoom<30)zoom*=f;}else{if(zoom>0.01)zoom/=f;}updateTransform();},{passive:true});
viewport.addEventListener("dblclick",e=>{if(!isTargetAdmin||e.target!==viewport)return;const n=prompt("Введите ник игрока:");if(!n)return;if(players.some(p=>p.name.toLowerCase()===n.trim().toLowerCase())){alert("Этот ник уже есть на карте!");return;}players.push({id:Date.now(),name:n,x:(e.clientX-panX)/zoom,y:(e.clientY-panY)/zoom});renderPlayers();});
function renderPlayers(){canvas.innerHTML="";players.forEach(p=>{const t=document.createElement("div");t.className="player-tag";const s=document.createElement("span");s.textContent=p.name;t.appendChild(s);const d=document.createElement("span");d.className="player-delete-btn";d.textContent="  ×";t.appendChild(d);t.style.left=p.x+"px";t.style.top=p.y+"px";d.addEventListener("click",e=>{e.stopPropagation();players=players.filter(pl=>pl.id!==p.id);renderPlayers();});if(isTargetAdmin){let drag=false;t.addEventListener("mousedown",e=>{if(e.target===d)return;e.stopPropagation();drag=true;});window.addEventListener("mousemove",e=>{if(drag){p.x=(e.clientX-panX)/zoom;p.y=(e.clientY-panY)/zoom;t.style.left=p.x+"px";t.style.top=p.y+"px";}});window.addEventListener("mouseup",()=>{if(drag)drag=false;});}canvas.appendChild(t);});}
updateTransform();loadPlayersFromServer();
</script></body></html>
