<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sandpex — Карта ников</title>
    <style>
        @font-face {
            font-family: 'Minecraftia';
            src: url('https://cdnfonts.com') format('woff');
            font-weight: normal; font-style: normal;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Minecraftia', sans-serif !important;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ffffff; color: #000000; }
        #ui-container { position: fixed; top: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; z-index: 99999; pointer-events: none; }
        .ui-element { pointer-events: auto; }
        #search-box { 
            padding: 10px 12px; width: 140px; height: 40px; border: 2px solid #000000; border-radius: 6px; font-size: 13px; outline: none; background: #ffffff; color: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            user-select: text !important; -webkit-user-select: text !important; 
        }
        @media(min-width: 480px) { #search-box { width: 250px; } }
        
        #admin-btn, #save-btn, #console-toggle-btn { 
            background: #000000; color: #ffffff; border: 2px solid #000000; padding: 0 16px; height: 40px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s; margin-left: 5px; display: inline-block; width: auto; line-height: 36px;
        }
        @media(min-width: 480px) { #admin-btn, #save-btn, #console-toggle-btn { padding: 0 20px; font-size: 13px; margin-left: 10px; } }
        #admin-btn:hover, #save-btn:hover, #console-toggle-btn:hover { background: #222222; border-color: #222222; }
        #admin-btn.logged-in { background: #2ecc71; border-color: #2ecc71; color: white; cursor: default; }
        #save-btn { display: none; background: #2f80ed; border-color: #2f80ed; color: white; }
        #console-toggle-btn { display: none; background: #9b59b6; border-color: #9b59b6; color: white; }
        .admin-mode #console-toggle-btn { display: inline-block; }
        #viewport { width: 100%; height: 100%; position: absolute; top: 0; left: 0; cursor: grab; touch-action: none; background: transparent; }
        #viewport:active { cursor: grabbing; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .player-tag { 
            position: absolute; font-weight: bold; white-space: nowrap; color: #000000; background: none !important; border: none !important; box-shadow: none !important; 
            padding: 0 0 3px 0 !important; display: flex; align-items: center; line-height: 1.1; font-size: 16px; transform-origin: left top;
            backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d;
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; pointer-events: auto;
            transition: opacity 0.1s;
        }
        .admin-mode .player-tag { cursor: move; }
        .player-tag.disabled-tag { opacity: 0.35; }
        
        .player-tag.selected-tag {
            outline: 2px dashed #ff0059 !important;
            outline-offset: 4px;
            background: rgba(255, 0, 89, 0.08) !important;
        }
        .player-tag.dimmed-tag {
            opacity: 0.15 !important;
            color: #7f8c8d !important;
        }
        .player-tag.highlighted-tag {
            color: #000000 !important;
            font-weight: 900 !important;
        }
        
        .rainbow-active {
            animation: rainbowAnim 4s linear infinite !important;
        }
        
        @keyframes rainbowAnim {
            0% { color: #ff0000; }
            17% { color: #ffa500; }
            33% { color: #ffff00; }
            50% { color: #008000; }
            67% { color: #0000ff; }
            83% { color: #4b0082; }
            100% { color: #ee82ee; }
        }
        .focus-rect {
            position: absolute;
            border: 3px solid #ff0059;
            background: rgba(255, 0, 89, 0.1);
            pointer-events: none;
            z-index: 9998;
            box-shadow: 0 0 15px rgba(255, 0, 89, 0.4);
            border-radius: 4px;
            display: none;
        }
        
        #selection-box {
            position: absolute;
            border: 1px solid #0078d7;
            background: rgba(0, 120, 215, 0.25);
            pointer-events: none;
            z-index: 99990;
            display: none;
        }
        .player-delete-btn { display: none; color: #e74c3c; cursor: pointer; margin-left: 6px; font-size: 14px; font-weight: bold; }
        .admin-mode .player-delete-btn { display: inline-block; }
        .pin-icon { display: none; position: absolute; right: 100%; margin-right: 4px; font-size: 0.9em; pointer-events: none; }
        .admin-mode .pin-icon { display: inline-block; }
        
        #nav-tip { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.05); color: #000; padding: 6px 16px; border-radius: 20px; font-size: 11px; text-align: center; pointer-events: none; z-index: 999; width: 90%; max-width: 400px; }
        #info-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999999; justify-content: center; align-items: center; padding: 15px; }
        .modal-box { background: #fff; padding: 20px; border-radius: 8px; width: 100%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 2px solid #000; }
        .modal-box h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .modal-box p { font-size: 14px; color: #333; line-height: 1.4; word-break: break-word; }
        .modal-box pre { font-family: monospace; background: #f4f4f4; padding: 8px; font-size: 11px; overflow-x: auto; border-radius: 4px; border: 1px solid #ddd; max-height: 100px; }
        .modal-box button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 14px; }
        
        .guide-line { position: fixed; border: none; background: none; z-index: 9998; pointer-events: none; display: none; }
        #guide-h { width: 100vw; height: 1px; border-top: 1px dashed #2f80ed; left: 0; }
        #guide-v { width: 1px; height: 100vh; border-left: 1px dashed #2f80ed; top: 0; }
        
        #mobile-add-btn { display: none; position: fixed; bottom: 65px; right: 20px; width: 56px; height: 56px; background: #000; color: #fff; border: none; border-radius: 50%; font-size: 28px; font-weight: bold; justify-content: center; align-items: center; cursor: pointer; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .admin-mode #mobile-add-btn { display: flex; }
        @media(min-width: 768px) { #mobile-add-btn { display: none !important; } }

        #perm-console-window { display: none; position: fixed; top: 120px; left: 50px; width: 440px; height: 320px; background: #111111; border: 3px solid #000000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000000; flex-direction: column; border-radius: 6px; overflow: hidden; pointer-events: auto; }
        .console-header { background: #000000; height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; border-bottom: 2px solid #222; cursor: move; color: #ffffff; font-weight: bold; font-size: 11px; letter-spacing: 0.5px; }
        .console-close { cursor: pointer; font-size: 18px; color: #ff003c; font-weight: bold; font-family: monospace; transition: 0.2s; padding: 0 4px; }
        .console-close:hover { color: #ffffff; }
        .console-output { flex: 1; padding: 12px; background: #111111; color: #00ff66; font-size: 11px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; border-bottom: 2px solid #222; font-family: monospace !important; }
        .console-input-row { display: flex; height: 40px; background: #161616; align-items: center; padding: 0 8px; }
        #console-cmd-input { flex: 1; height: 28px; background: #000000; border: 1px solid #333; color: #ffffff; outline: none; font-size: 11px; padding: 0 8px; border-radius: 4px; font-family: monospace !important; user-select: text !important; -webkit-user-select: text !important; }
        #console-cmd-input:focus { border-color: #00ff66; }
        #console-send-btn { width: 34px; height: 28px; background: #00ff66; border: none; color: #000000; font-weight: bold; font-size: 12px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-left: 6px; }
        #console-send-btn:hover { background: #2ecc71; }
    </style>
</head>
<body>
    <div id="ui-container">
        <div></div>
        <input type="text" id="search-box" class="ui-element" placeholder="Найти ник...">
        <div class="ui-element">
            <button id="save-btn">Скачать файл карты</button>
            <button id="console-toggle-btn">Консоль</button>
            <button id="admin-btn">Войти как Admin</button>
        </div>
    </div>
    <button id="mobile-add-btn">+</button>
    <div id="nav-tip">ЛКМ: Карта | Shift + Мышь: Выделение рамкой | Двойной клик: Создать ник</div>
    <div id="viewport">
        <div id="canvas">
            <div id="focus-rectangle" class="focus-rect"></div>
            <div id="selection-box"></div>
        </div>
    </div>

    <div id="perm-console-window">
        <div class="console-header" id="console-drag-handle">
            <span>СИСТЕМНЫЙ ТЕРМИНАЛ РАЗРЕШЕНИЙ</span>
            <span class="console-close" id="console-close-btn">×</span>
        </div>
        <div class="console-output" id="console-log-box"></div>
        <div class="console-input-row">
            <input type="text" id="console-cmd-input" placeholder="Введите команду..." autocomplete="off">
            <button id="console-send-btn">➔</button>
        </div>
    </div>

    <div id="guide-h" class="guide-line"></div>
    <div id="guide-v" class="guide-line"></div>
    
    <div id="info-modal"><div class="modal-box" id="modal-box"></div></div>
    <script>
        const SECRET_KEY = "sandpex2019wh";
        const viewport = document.getElementById("viewport");
        const canvas = document.getElementById("canvas");
        const adminBtn = document.getElementById("admin-btn");
        const saveBtn = document.getElementById("save-btn");
        const consoleToggleBtn = document.getElementById("console-toggle-btn");
        const searchBox = document.getElementById("search-box");
        const infoModal = document.getElementById("info-modal");
        const modalBox = document.getElementById("modal-box");
        const guideH = document.getElementById("guide-h");
        const guideV = document.getElementById("guide-v");
        const mobileAddBtn = document.getElementById("mobile-add-btn");
        const selectionBox = document.getElementById("selection-box");
        const focusRectangle = document.getElementById("focus-rectangle");
        
        const permConsole = document.getElementById("perm-console-window");
        const consoleCloseBtn = document.getElementById("console-close-btn");
        const consoleLogBox = document.getElementById("console-log-box");
        const consoleCmdInput = document.getElementById("console-cmd-input");
        const consoleSendBtn = document.getElementById("console-send-btn");
        const consoleDragHandle = document.getElementById("console-drag-handle");

        let isTargetAdmin = localStorage.getItem("sandpex_is_admin") === "true";
        let panX = window.innerWidth / 2, panY = window.innerHeight / 2, zoom = 1;
        let isPanning = false, startX, startY, players = [];
        
        let dragActive = false, dragPlayerId = null, dragElement = null;
        
        let isCtrlPressed = false;
        let isShiftPressed = false;
        let isSelecting = false;
        let selStartX = 0, selStartY = 0;
        let selectedPlayerIds = new Set();
        let focusedPlayerId = null;
        
        let epsteinMode = false;
        let activeRainbowTimers = {};
        let systemLogs = [];
        function getPermissions() {
            try {
                return JSON.parse(localStorage.getItem("user_permissions") || "[]");
            } catch(e) {
                return [];
            }
        }

        function savePermissions(perms) {
            try {
                localStorage.setItem("user_permissions", JSON.stringify(perms));
            } catch(e) {}
        }

        function logToConsole(text, type = "info") {
            const line = document.createElement("div");
            if (type === "error") line.style.color = "#ff003c";
            else if (type === "success") line.style.color = "#00ff66";
            else if (type === "event") line.style.color = "#3498db";
            else line.style.color = "#ffffff";
            line.textContent = `[SYSTEM] ${text}`;
            consoleLogBox.appendChild(line);
            consoleLogBox.scrollTop = consoleLogBox.scrollHeight;
        }

        function pushSystemLog(text, isError = false) {
            const time = new Date().toLocaleTimeString();
            systemLogs.push({ msg: `[${time}] ${text}`, err: isError });
        }

        function executeConsoleCommand() {
            const raw = consoleCmdInput.value.trim();
            if (!raw) return;
            logToConsole(`> ${raw}`);
            consoleCmdInput.value = "";
            pushSystemLog(`Ввод команды: ${raw}`);

            const parts = raw.split(/\s+/);
            const baseCmd = parts[0].toLowerCase();

            if (baseCmd === "perm") {
                if (parts.length < 2) {
                    const err = "Ошибка: Используйте perm add [название], perm remove [название] или perm list";
                    logToConsole(err, "error"); pushSystemLog(err, true); return;
                }
                const subAction = parts[1].toLowerCase();

                if (subAction === "list") {
                    const currentPerms = getPermissions();
                    logToConsole(`Активные разрешения: ${currentPerms.length ? currentPerms.join(", ") : "нет"}`);
                    return;
                }

                if (parts.length < 3) {
                    const err = `Ошибка: Не указано название разрешения для действия "${subAction}"`;
                    logToConsole(err, "error"); pushSystemLog(err, true); return;
                }

                const permName = parts.slice(2).join(" ").trim();
                let currentPerms = getPermissions();

                if (subAction === "add") {
                    if (currentPerms.includes(permName)) {
                        const err = `Ошибка: Разрешение "${permName}" уже есть у пользователя!`;
                        logToConsole(err, "error"); pushSystemLog(err, true);
                    } else {
                        currentPerms.push(permName);
                        savePermissions(currentPerms);
                        logToConsole(`Разрешение "${permName}" успешно добавлено.`, "success");
                        pushSystemLog(`Выдано разрешение: ${permName}`);
                    }
                } else if (subAction === "remove") {
                    if (!currentPerms.includes(permName)) {
                        const err = `Ошибка: Разрешения "${permName}" нет у пользователя!`;
                        logToConsole(err, "error"); pushSystemLog(err, true);
                    } else {
                        currentPerms = currentPerms.filter(p => p !== permName);
                        savePermissions(currentPerms);
                        logToConsole(`Разрешение "${permName}" успешно удалено.`, "success");
                        pushSystemLog(`Удалено разрешение: ${permName}`);
                    }
                } else {
                    const err = `Ошибка: Неизвестное поддействие "${subAction}". Допустимы: add, remove, list`;
                    logToConsole(err, "error"); pushSystemLog(err, true);
                }
            } else if (baseCmd === "logs") {
                if (systemLogs.length === 0) {
                    logToConsole("Логи пусты.", "info");
                } else {
                    logToConsole("--- ВЫВОД ВСЕХ СИСТЕМНЫХ ЛОГОВ ---", "info");
                    systemLogs.forEach(l => {
                        logToConsole(l.msg, l.err ? "error" : "event");
                    });
                }
            } else if (baseCmd === "clear") {
                consoleLogBox.innerHTML = "";
            } else if (baseCmd === "help") {
                logToConsole("Доступные команды:");
                logToConsole("  perm add [название] - добавить разрешение");
                logToConsole("  perm remove [название] - удалить разрешение");
                logToConsole("  perm list - показать список всех разрешений");
                logToConsole("  logs - вывести всю историю активности и ошибок");
                logToConsole("  clear - очистить лог терминала");
            } else {
                const err = `Неизвестная команда: "${baseCmd}". Введите help для списка.`;
                logToConsole(err, "error"); pushSystemLog(err, true);
            }
        }
        if (consoleToggleBtn) {
            consoleToggleBtn.addEventListener("click", () => {
                permConsole.style.display = (permConsole.style.display === "flex") ? "none" : "flex";
                if (permConsole.style.display === "flex") {
                    consoleCmdInput.focus();
                    const perms = getPermissions();
                    consoleLogBox.innerHTML = "";
                    logToConsole("Система управления правами запущена.");
                    logToConsole(`Активные разрешения: ${perms.length ? perms.join(", ") : "нет"}`);
                    pushSystemLog("Открытие терминала разрешений");
                }
            });
        }

        if (consoleCloseBtn) {
            consoleCloseBtn.addEventListener("click", () => { 
                permConsole.style.display = "none"; 
                pushSystemLog("Закрытие терминала разрешений");
            });
        }

        if (consoleSendBtn) {
            consoleSendBtn.addEventListener("click", executeConsoleCommand);
        }

        if (consoleCmdInput) {
            consoleCmdInput.addEventListener("keydown", e => {
                if (e.key === "Enter") executeConsoleCommand();
            });
        }

        let isConsoleDragging = false;
        let consoleOffsetX = 0, consoleOffsetY = 0;

        if (consoleDragHandle) {
            consoleDragHandle.addEventListener("mousedown", e => {
                if (e.target === consoleCloseBtn) return;
                isConsoleDragging = true;
                consoleOffsetX = e.clientX - permConsole.offsetLeft;
                consoleOffsetY = e.clientY - permConsole.offsetTop;
                pushSystemLog("Начало перемещения окна консоли");
            });
        }

        window.addEventListener("mousemove", e => {
            if (isConsoleDragging) {
                permConsole.style.left = (e.clientX - consoleOffsetX) + "px";
                permConsole.style.top = (e.clientY - consoleOffsetY) + "px";
            }
        });

        window.addEventListener("mouseup", () => { 
            if (isConsoleDragging) {
                isConsoleDragging = false; 
                pushSystemLog("Конец перемещения окна консоли");
            }
        });

        window.addEventListener("keydown", e => { 
            if (e.key === "Control") isCtrlPressed = true; 
            if (e.key === "Shift") isShiftPressed = true;
        });
        window.addEventListener("keyup", e => { 
            if (e.key === "Control") isCtrlPressed = false; 
            if (e.key === "Shift") isShiftPressed = false;
        });
        
        function updateTransform() { renderPlayers(); repositionFocusRectangle(); }
        
        if (isTargetAdmin) { 
            document.body.classList.add("admin-mode"); 
            adminBtn.textContent = "Режим: Администратор"; 
            adminBtn.classList.add("logged-in"); 
            saveBtn.style.display = "inline-block"; 
        }
        adminBtn.addEventListener("click", () => {
            if (isTargetAdmin) return;
            const p = prompt("Введите пароль администратора для sandpex:");
            if (p === null) return;
            const checkPass = p.trim().toLowerCase();
            if (checkPass === "пароль" || checkPass === "пароль администратора для sandpex") {
                alert("Да ты шутник!");
                pushSystemLog("Попытка ввода шуточного пароля администратора", true);
                return;
            }
            if (p === SECRET_KEY) { 
                localStorage.setItem("sandpex_is_admin", "true"); 
                alert("Доступ разрешен!"); 
                pushSystemLog("Успешная авторизация администратора");
                window.location.reload(); 
            }
            else { 
                alert("Неверный пароль!"); 
                pushSystemLog(`Неудачная попытка входа с паролем: ${p}`, true);
            }
        });
        async function loadPlayersFromServer(){
            try{
                const r = await fetch("players.json?t=" + Date.now(), { cache: "no-store" });
                if (r.ok) { 
                    players = await r.json(); 
                    renderPlayers(); 
                    pushSystemLog("База данных игроков успешно загружена с сервера");
                }
            } catch (e) { 
                console.log("Ошибка чтения файла базы."); 
                pushSystemLog("Критическая ошибка при загрузке базы данных", true);
            }
        }
        saveBtn.addEventListener("click", () => {
            if (!isTargetAdmin) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(players, null, 2));
            const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", "players.json");
            document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove(); 
            alert("Файл 'players.json' успешно скачан! Загрузите его на GitHub.");
            pushSystemLog("Администратор скачал файл базы данных players.json");
        });

        searchBox.addEventListener("input", () => {
            const rawVal = searchBox.value;
            const q = rawVal.trim().toLowerCase();
            
            if (q === "найти ник") {
                alert("чё самый умный?");
                pushSystemLog("Пользователь ввёл фразу-заглушку в поиск ников", true);
                searchBox.value = "";
                return;
            }
            if (q === "minecraft") {
                alert("Это наша история");
                pushSystemLog("Активирована пасхалка 'minecraft' в поиске");
                searchBox.value = "";
                return;
            }
            if (q === "epstein") {
                epsteinMode = true;
                focusedPlayerId = null;
                focusRectangle.style.display = "none";
                renderPlayers();
                pushSystemLog("Активирован скрытый режим 'epsteinMode'");
                return;
            } else if (epsteinMode && !q) {
                epsteinMode = false;
                pushSystemLog("Отключение режима 'epsteinMode'");
            }
            
            if (!q) {
                focusedPlayerId = null;
                focusRectangle.style.display = "none";
                renderPlayers();
                return;
            }
            
            let exactMatch = null;
            players.forEach(p => {
                if ((!p.hidden || isTargetAdmin) && p.name.toLowerCase() === q) {
                    exactMatch = p;
                }
            });

            if (exactMatch) {
                focusedPlayerId = exactMatch.id;
                zoom = 1.5;
                panX = window.innerWidth / 2 - exactMatch.x * zoom;
                panY = window.innerHeight / 2 - exactMatch.y * zoom;
                updateTransform();
                pushSystemLog(`Поиск обнаружил точное совпадение для игрока: ${exactMatch.name}`);
            } else {
                focusedPlayerId = null;
                focusRectangle.style.display = "none";
                renderPlayers();
            }
        });
        function repositionFocusRectangle() {
            if (!focusedPlayerId) {
                focusRectangle.style.display = "none";
                return;
            }
            const activeEl = canvas.querySelector(`[data-id="${focusedPlayerId}"]`);
            if (!activeEl) {
                focusRectangle.style.display = "none";
                return;
            }
            const sEl = activeEl.querySelector("span");
            if (!sEl) return;
            
            const textWidth = sEl.offsetWidth;
            const textHeight = sEl.offsetHeight;
            const p = players.find(pl => pl.id === focusedPlayerId);
            if (!p) return;
            
            const currentScale = (p.scale || 1) * zoom;
            const finalWidth = (textWidth + 8) * currentScale;
            const finalHeight = (textHeight + 6) * currentScale;
            
            const nextX = p.x * zoom + panX - (4 * currentScale);
            const nextY = p.y * zoom + panY - (3 * currentScale);
            
            focusRectangle.style.left = nextX + "px";
            focusRectangle.style.top = nextY + "px";
            focusRectangle.style.width = finalWidth + "px";
            focusRectangle.style.height = finalHeight + "px";
            focusRectangle.style.display = "block";
        }

        function createNewPlayer(clientX, clientY) {
            if (!isTargetAdmin) return;
            const n = prompt("Введите ник игрока:"); if (!n) return;
            if (players.some(p => p.name.toLowerCase() === n.trim().toLowerCase())) { 
                alert("Этот ник уже есть на карте!"); 
                pushSystemLog(`Попытка создать дубликат ника: ${n}`, true);
                return; 
            }
            const targetX = (clientX - panX) / zoom;
            const targetY = (clientY - panY) / zoom;
            players.push({ id: Date.now(), name: n, x: targetX, y: targetY, color: "#000000", description: "", pinned: false, scale: 1, layer: 1, hidden: false });
            pushSystemLog(`Создан новый ник: ${n} на координатах X:${Math.round(targetX)} Y:${Math.round(targetY)}`);
            renderPlayers();
        }

        let mapHoldTimer;
        viewport.addEventListener("mousedown", e => {
            if (e.button !== 0 || dragActive) return;
            if (isShiftPressed) {
                isSelecting = true;
                const rect = canvas.getBoundingClientRect();
                selStartX = e.clientX - rect.left;
                selStartY = e.clientY - rect.top;
                selectionBox.style.left = selStartX + "px";
                selectionBox.style.top = selStartY + "px";
                selectionBox.style.width = "0px";
                selectionBox.style.height = "0px";
                selectionBox.style.display = "block";
                if (!isCtrlPressed) selectedPlayerIds.clear();
                e.preventDefault();
                pushSystemLog("Начало выделения области рамкой (Shift + ЛКМ)");
                return;
            }
            if (e.target === viewport) {
                mapHoldTimer = setTimeout(() => {
                    createNewPlayer(e.clientX, e.clientY);
                    isPanning = false;
                }, 1500);
            }
            isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            pushSystemLog(`Захват карты мыши для перетаскивания: X:${e.clientX} Y:${e.clientY}`);
        });
        window.addEventListener("mousemove", e => { 
            clearTimeout(mapHoldTimer);
            if (isSelecting) {
                const rect = canvas.getBoundingClientRect();
                const currentX = e.clientX - rect.left;
                const currentY = e.clientY - rect.top;
                const x = Math.min(selStartX, currentX);
                const y = Math.min(selStartY, currentY);
                const width = Math.abs(selStartX - currentX);
                const height = Math.abs(selStartY - currentY);
                
                selectionBox.style.left = x + "px";
                selectionBox.style.top = y + "px";
                selectionBox.style.width = width + "px";
                selectionBox.style.height = height + "px";
                
                const boxRect = selectionBox.getBoundingClientRect();
                const tags = canvas.querySelectorAll(".player-tag");
                tags.forEach(tag => {
                    const tagId = parseInt(tag.getAttribute("data-id"), 10);
                    if (isNaN(tagId)) return;
                    const tagRect = tag.getBoundingClientRect();
                    const overlap = !(boxRect.right < tagRect.left || 
                                      boxRect.left > tagRect.right || 
                                      boxRect.bottom < tagRect.top || 
                                      boxRect.top > tagRect.bottom);
                    if (overlap) {
                        selectedPlayerIds.add(tagId);
                    } else {
                        if (!isCtrlPressed) selectedPlayerIds.delete(tagId);
                    }
                });
                renderPlayers();
                return;
            }
            if (isPanning && !dragActive) { 
                panX = e.clientX - startX; panY = e.clientY - startY; updateTransform(); 
            } 
        });

        window.addEventListener("mouseup", () => { 
            clearTimeout(mapHoldTimer); 
            if (isPanning) {
                isPanning = false;
                pushSystemLog("Карта перемещена пользователем");
            }
            if (isSelecting) {
                isSelecting = false;
                selectionBox.style.display = "none";
                pushSystemLog(`Завершено групповое выделение. Выбрано ников: ${selectedPlayerIds.size}`);
            }
        });
        viewport.addEventListener("dblclick", e => {
            e.preventDefault();
            if (e.target === viewport && !isShiftPressed) {
                createNewPlayer(e.clientX, e.clientY);
            }
        });
        
        let touchStartDist = 0, touchStartZoom = 1;
        viewport.addEventListener("touchstart", e => {
            if (dragActive) return;
            if (e.touches.length === 1) {
                isPanning = true; startX = e.touches[0].clientX - panX; startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isPanning = false;
                touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                touchStartZoom = zoom;
                pushSystemLog("Начало мобильного масштабирования (Pinch Zoom)");
            }
        });
        window.addEventListener("touchmove", e => {
            if (isPanning && e.touches.length === 1) {
                panX = e.touches[0].clientX - startX; panY = e.touches[0].clientY - startY; updateTransform();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const factor = dist / touchStartDist; const oldZoom = zoom;
                zoom = Math.max(0.01, Math.min(30, touchStartZoom * factor));
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                panX = midX - (midX - panX) * (zoom / oldZoom);
                panY = midY - (midY - panY) * (zoom / oldZoom);
                updateTransform();
            }
        });
        window.addEventListener("touchend", () => { 
            if (isPanning) {
                isPanning = false;
                pushSystemLog("Тач-перемещение завершено");
            }
        });

        window.addEventListener("wheel", e => {
            const oldZoom = zoom; const f = 1.1;
            if (e.deltaY < 0) { if (zoom < 30) zoom *= f; } else { if (zoom > 0.01) zoom /= f; }
            const mouseX = e.clientX; const mouseY = e.clientY;
            panX = mouseX - (mouseX - panX) * (zoom / oldZoom);
            panY = mouseY - (mouseY - panY) * (zoom / oldZoom);
            updateTransform();
        }, { passive: true });

        mobileAddBtn.addEventListener("click", () => {
            if (!isTargetAdmin) return;
            createNewPlayer(window.innerWidth / 2, window.innerHeight / 2);
        });

        infoModal.addEventListener("click", e => { if (e.target === infoModal) infoModal.style.display = "none"; });
        function showPlayerMenu(p, e) {
            if(e) e.preventDefault();
            modalBox.innerHTML = "<h3>Игрок: " + p.name + "</h3>";
            const descText = p.description && p.description.trim() ? p.description : "Описание отсутствует.";
            modalBox.innerHTML += "<p><strong>Описание:</strong><br>" + descText + "</p>";

            if (isTargetAdmin) {
                modalBox.innerHTML += "<button id='edit-desc-btn' style='background:#2f80ed;margin-bottom:5px;'>Изменить описание</button>";
                modalBox.innerHTML += "<button id='edit-color-btn' style='background:#e67e22;margin-bottom:5px;'>Изменить цвет текста</button>";
                modalBox.innerHTML += "<button id='edit-scale-btn' style='background:#9b59b6;margin-bottom:5px;'>Изменить масштаб текста (" + (p.scale || 1) + ")</button>";
                modalBox.innerHTML += "<button id='edit-layer-btn' style='background:#1abc9c;margin-bottom:5px;'>Изменить слой текста (" + (p.layer !== undefined ? p.layer : 1) + ")</button>";
                
                const hideTxt = p.hidden ? "Включить видимость" : "Временно выключить ник";
                modalBox.innerHTML += "<button id='toggle-hide-btn' style='background:#7f8c8d;margin-bottom:5px;'>" + hideTxt + "</button>";
                
                const pinTxt = p.pinned ? "Открепить ник" : "Закрепить ник";
                modalBox.innerHTML += "<button id='toggle-pin-btn' style='background:#d35400;margin-bottom:10px;'>" + pinTxt + "</button>";
                modalBox.innerHTML += "<strong>Данные из players.json:</strong>";
                const rawInfo = { id: p.id, name: p.name, x: Math.round(p.x), y: Math.round(p.y), color: p.color || "#000000", description: p.description || "", pinned: !!p.pinned, scale: p.scale || 1, layer: p.layer !== undefined ? p.layer : 1, hidden: !!p.hidden };
                modalBox.innerHTML += "<pre>" + JSON.stringify(rawInfo, null, 2) + "</pre>";
            }

            modalBox.innerHTML += "<button id='close-modal-btn' style='background:#7f8c8d;'>Закрыть</button>";
            infoModal.style.display = "flex";
            pushSystemLog(`Открыто контекстное меню игрока: ${p.name}`);

            document.getElementById('close-modal-btn').addEventListener('click', () => infoModal.style.display = "none");
            
            if (isTargetAdmin) {
                document.getElementById('edit-desc-btn').addEventListener('click', () => {
                    const newDesc = prompt("Введите описание для " + p.name + ":", p.description || "");
                    if (newDesc !== null) { p.description = newDesc; renderPlayers(); infoModal.style.display = "none"; pushSystemLog(`Изменено описание для ${p.name}`); }
                });
                document.getElementById('edit-color-btn').addEventListener('click', () => {
                    const newColor = prompt("Введите цвет для " + p.name + ":", p.color || "#000000");
                    if (newColor !== null) { p.color = newColor.trim() ? newColor.trim().toLowerCase() : "#000000"; renderPlayers(); infoModal.style.display = "none"; pushSystemLog(`Изменен цвет для ${p.name} на ${p.color}`); }
                });
                document.getElementById('edit-scale-btn').addEventListener('click', () => {
                    const newScale = prompt("Масштаб текста (например: 1, 1.5, 0.5):", p.scale || 1);
                    if (newScale !== null && !isNaN(newScale) && Number(newScale) > 0) { p.scale = Number(newScale); renderPlayers(); infoModal.style.display = "none"; pushSystemLog(`Изменен масштаб для ${p.name} на ${p.scale}`); }
                });
                document.getElementById('edit-layer-btn').addEventListener('click', () => {
                    const newLayer = prompt("Введите номер слоя (целое число, например: 1, 2, 0):", p.layer !== undefined ? p.layer : 1);
                    if (newLayer !== null && !isNaN(newLayer)) { p.layer = parseInt(newLayer, 10); renderPlayers(); infoModal.style.display = "none"; pushSystemLog(`Изменен слой для ${p.name} на ${p.layer}`); }
                });
                document.getElementById('toggle-hide-btn').addEventListener('click', () => { p.hidden = !p.hidden; renderPlayers(); infoModal.style.display = "none"; pushSystemLog(`Переключена видимость для ${p.name}. Скрыт: ${p.hidden}`); });
                document.getElementById('toggle-pin-btn').addEventListener('click', () => { p.pinned = !p.pinned; renderPlayers(); infoModal.style.display = "none"; pushSystemLog(`Переключен пин для ${p.name}. Закреплен: ${p.pinned}`); });
            }
        }

        let jebClickCount = 0, jebLastClickTime = 0;
        let mokinasClickCount = 0, mokinasLastClickTime = 0;
        let tcClickCount = 0, tcLastClickTime = 0;

        function renderPlayers(){
            const oldTags = canvas.querySelectorAll('.player-tag');
            oldTags.forEach(t => { if (t.id !== "focus-rectangle") t.remove(); });

            const q = searchBox.value.trim().toLowerCase();

            players.forEach(p => {
                if (p.hidden && !isTargetAdmin) return;

                const t = document.createElement("div"); t.className = "player-tag";
                t.setAttribute("data-id", p.id);
                
                if (p.hidden && isTargetAdmin) { t.classList.add("disabled-tag"); }
                if (selectedPlayerIds.has(p.id)) { t.classList.add("selected-tag"); }

                if (q && !epsteinMode) {
                    if (p.name.toLowerCase().startsWith(q)) { t.classList.add("highlighted-tag"); } 
                    else { t.classList.add("dimmed-tag"); }
                }
                
                const s = document.createElement("span"); 
                if (epsteinMode) { s.textContent = "■".repeat(p.name.length); } 
                else { s.textContent = p.name; }
                t.appendChild(s);
                
                if (activeRainbowTimers[p.id]) { t.classList.add("rainbow-active"); }

                t.addEventListener("click", e => {
                    const now = Date.now();
                    pushSystemLog(`Клик по нику игрока: ${p.name}`);
                    if (p.name === "jeb_") {
                        if (now - jebLastClickTime > 3000) jebClickCount = 0;
                        jebLastClickTime = now; jebClickCount++;
                        if (jebClickCount === 3) {
                            jebClickCount = 0;
                            if (activeRainbowTimers[p.id]) clearTimeout(activeRainbowTimers[p.id]);
                            t.classList.add("rainbow-active");
                            activeRainbowTimers[p.id] = setTimeout(() => {
                                t.classList.remove("rainbow-active");
                                delete activeRainbowTimers[p.id];
                            }, 10000);
                            pushSystemLog("Активирована радужная пасхалка 'jeb_'");
                        }
                    }
                    if (p.name === "Mokinas48888") {
                        if (now - mokinasLastClickTime > 3000) mokinasClickCount = 0;
                        mokinasLastClickTime = now; mokinasClickCount++;
                        if (mokinasClickCount === 100) {
                            mokinasClickCount = 0;
                            pushSystemLog("Секретный переход: 100 кликов по Mokinas48888 -> file1.html");
                            window.location.href = "file1.html";
                        }
                    }
                    if (p.name.toLowerCase() === "topcaper") {
                        if (now - tcLastClickTime > 3000) tcClickCount = 0;
                        tcLastClickTime = now; tcClickCount++;
                        if (tcClickCount === 10) {
                            tcClickCount = 0;
                            pushSystemLog("Секретный переход: 10 кликов по topcaper -> file2.html");
                            window.location.href = "file2.html";
                        }
                    }
                    if (p.name === "AC/DC") {
                        window.open("https://youtu.be", "_blank");
                        pushSystemLog("Активирована пасхалка AC/DC: открыт YouTube");
                    }
                });
                const d = document.createElement("span"); d.className = "player-delete-btn"; d.textContent = "  ×"; t.appendChild(d);
                
                t.style.left = "0px";
                t.style.top = "0px";
                
                const currentScale = (p.scale || 1) * zoom;
                const currentX = p.x * zoom + panX;
                const currentY = p.y * zoom + panY;
                
                t.style.transform = "translate3d(" + currentX + "px, " + currentY + "px, 0) scale(" + currentScale + ")";
                
                if (!activeRainbowTimers[p.id]) {
                    if (!q || p.name.toLowerCase().startsWith(q) || epsteinMode) {
                        t.style.color = p.color || "#000000";
                    }
                }
                
                t.style.zIndex = p.layer !== undefined ? p.layer : 1;
                
                if (p.pinned) {
                    t.style.fontWeight = "900";
                    const pin = document.createElement("span");
                    pin.className = "pin-icon";
                    pin.textContent = "📌";
                    t.appendChild(pin);
                }

                t.addEventListener("contextmenu", e => showPlayerMenu(p, e));
                
                let touchTimer;
                t.addEventListener("touchstart", e => {
                    if (dragActive) return;
                    touchTimer = setTimeout(() => { showPlayerMenu(p, null); }, 800);
                });
                t.addEventListener("touchend", () => clearTimeout(touchTimer));
                t.addEventListener("touchmove", () => clearTimeout(touchTimer));

                d.addEventListener("click", e => { 
                    e.stopPropagation(); 
                    pushSystemLog(`Ник удален с карты: ${p.name}`);
                    players = players.filter(pl => pl.id !== p.id); 
                    renderPlayers(); 
                });
                
                if (isTargetAdmin && !p.pinned) {
                    const onStart = () => {
                        isPanning = false;
                        dragActive = true;
                        dragPlayerId = p.id;
                        dragElement = t;
                        pushSystemLog(`Начало перетаскивания ника: ${p.name}`);
                    };
                    t.addEventListener("mousedown", e => { if (e.button === 0 && e.target !== d) { e.stopPropagation(); onStart(); } });
                    t.addEventListener("touchstart", e => { if (e.touches.length === 1 && e.target !== d) { e.stopPropagation(); onStart(); } });
                }
                canvas.appendChild(t);
            });
        }

        const processDrag = (clientX, clientY) => {
            if (!dragActive || !dragPlayerId || !dragElement) return;
            const p = players.find(pl => pl.id === dragPlayerId);
            if (!p) return;

            let targetX = (clientX - panX) / zoom;
            let targetY = (clientY - panY) / zoom;
            let snapH = false, snapV = false;
            
            p.x = targetX; p.y = targetY;
            const currentScale = (p.scale || 1) * zoom;
            const nextX = targetX * zoom + panX;
            const nextY = targetY * zoom + panY;
            dragElement.style.transform = "translate3d(" + nextX + "px, " + nextY + "px, 0) scale(" + currentScale + ")";
            
            if (!isCtrlPressed) {
                let currentRect = dragElement.getBoundingClientRect();

                players.forEach(other => {
                    if (other.id !== p.id && other.pinned && (!other.hidden || isTargetAdmin)) {
                        let otherEl = canvas.querySelector(`[data-id="${other.id}"]`);
                        if(!otherEl) return;
                        let otherRect = otherEl.getBoundingClientRect();

                        if (Math.abs(clientY - otherRect.top - otherRect.height/2) < 15) {
                            targetY = other.y; snapH = true;
                            guideH.style.top = (otherRect.top + otherRect.height/2) + "px"; guideH.style.display = "block";
                        }
                        if (Math.abs(clientX - otherRect.left - otherRect.width/2) < 15) {
                            targetX = other.x; snapV = true;
                            guideV.style.left = (otherRect.left + otherRect.width/2) + "px"; guideV.style.display = "block";
                        }

                        players.forEach(secondOther => {
                            if(secondOther.id !== p.id && secondOther.id !== other.id && secondOther.pinned && (!secondOther.hidden || isTargetAdmin)) {
                                let secEl = canvas.querySelector(`[data-id="${secondOther.id}"]`);
                                if(!secEl) return;
                                let secRect = secEl.getBoundingClientRect();

                                let standardGapX = Math.abs(otherRect.left - secRect.left);
                                if(standardGapX > 10) {
                                    if(Math.abs(Math.abs(currentRect.left - otherRect.left) - standardGapX) < 15) {
                                        targetX = other.x + (otherRect.left - secRect.left) / zoom;
                                        snapV = true; guideV.style.left = currentRect.left + "px"; guideV.style.display = "block";
                                    }
                                }
                                let standardGapY = Math.abs(otherRect.top - secRect.top);
                                if(standardGapY > 10) {
                                    if(Math.abs(Math.abs(currentRect.top - otherRect.top) - standardGapY) < 15) {
                                        targetY = other.y + (otherRect.top - secRect.top) / zoom;
                                        snapH = true; guideH.style.top = currentRect.top + "px"; guideH.style.display = "block";
                                    }
                                }
                            }
                        });
                    }
                });
            }

            if (!snapH) guideH.style.display = "none";
            if (!snapV) guideV.style.display = "none";
            p.x = targetX; p.y = targetY;
            const finalX = p.x * zoom + panX;
            const finalY = p.y * zoom + panY;
            dragElement.style.transform = "translate3d(" + finalX + "px, " + finalY + "px, 0) scale(" + currentScale + ")";
        };

        const processDragMove = (e) => {
            if (!dragActive) return;
            if (e.touches && e.touches.length === 1) {
                processDrag(e.touches.clientX, e.touches.clientY);
            } else if (e.clientX !== undefined) {
                processDrag(e.clientX, e.clientY);
            }
        };

        const stopDrag = () => {
            if (dragActive) {
                const p = players.find(pl => pl.id === dragPlayerId);
                if (p) pushSystemLog(`Ник перемещен на новую позицию X:${Math.round(p.x)} Y:${Math.round(p.y)}`);
                dragActive = false; dragPlayerId = null; dragElement = null;
                guideH.style.display = "none"; guideV.style.display = "none";
            }
        };

        window.addEventListener("mousemove", processDragMove);
        window.addEventListener("touchmove", processDragMove, { passive: false });
        window.addEventListener("mouseup", stopDrag);
        window.addEventListener("touchend", stopDrag);

        updateTransform(); loadPlayersFromServer();
    </script>
</body>
</html>
