<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="game-title">sandpex — Легендарный Пинг-Понг</title>
    <style>
        @font-face {
            font-family: 'Minecraftia';
            src: url('https://cdnfonts.com') format('woff');
            font-weight: normal; font-style: normal;
        }
        * { box-sizing: border-box; font-family: 'Minecraftia', sans-serif !important; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; }
        
        #game-stage { width: 900px; height: 600px; border: 4px solid #000000; position: relative; background: #fafafa; overflow: hidden; display: block; transition: background 0.5s ease; }
        
        #game-stage.boss-mode {
            animation: borderNeon 5s linear infinite, bgGlitch 4s ease-in-out infinite alternate;
        }
        
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease; pointer-events: none; z-index: 0; }
        #bg-video.active { opacity: 0.25; }

        @keyframes borderNeon {
            0% { border-color: #ff0059; box-shadow: 0 0 15px rgba(255, 0, 89, 0.4); }
            33% { border-color: #0056ff; box-shadow: 0 0 15px rgba(0, 86, 255, 0.4); }
            66% { border-color: #ff003c; box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }
            100% { border-color: #ff0059; box-shadow: 0 0 15px rgba(255, 0, 89, 0.4); }
        }
        @keyframes bgGlitch {
            0% { background: #fafafa; }
            50% { background: #f2e6e6; }
            100% { background: #ebd5d5; }
        }
        
        .paddle { position: absolute; font-weight: bold; font-size: 16px; white-space: nowrap; padding: 6px 12px; border-radius: 4px; display: flex; align-items: center; justify-content: center; height: 35px; z-index: 10; }
        .player-paddle { color: #0056ff; border: 3px solid #0056ff; background: rgba(0, 86, 255, 0.1); bottom: 30px; }
        .bot-paddle { color: #ff003c; border: 3px solid #ff003c; background: rgba(255, 0, 60, 0.1); top: 30px; transition: filter 0.2s ease; }
        
        #ball { position: absolute; font-size: 24px; font-weight: 900; color: #000000; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; line-height: 1; z-index: 9; }
        
        .glitch-tag { position: absolute; font-weight: bold; font-size: 14px; color: #000000; border: 2px solid #000000; background: rgba(0, 0, 0, 0.08); padding: 4px 8px; border-radius: 3px; white-space: nowrap; pointer-events: none; z-index: 5; }
        .red-orb { position: absolute; font-size: 22px; font-weight: 900; color: #ff003c; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; line-height: 1; pointer-events: none; z-index: 6; }
        
        .ash-particle { position: absolute; width: 5px; height: 5px; background: rgba(40, 40, 40, 0.35); pointer-events: none; z-index: 2; }
        
        .side-ribbon { position: absolute; top: 0; width: 85px; height: 100%; overflow: hidden; display: none; z-index: 1; opacity: 0.15; font-size: 10px; font-weight: bold; color: #000; }
        #left-ribbon { left: 5px; }
        #right-ribbon { right: 5px; }
        .ribbon-track { position: absolute; display: flex; flex-direction: column; width: 100%; gap: 15px; }
        
        .plasmatron-zone { position: absolute; top: 0; height: 100%; display: none; z-index: 3; pointer-events: none; }
        .plasmatron-warn { background: rgba(255, 0, 60, 0.15); border-left: 2px dashed #ff003c; border-right: 2px dashed #ff003c; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ff003c; font-weight: 900; }
        .plasmatron-warn.pulse-glow { animation: warnPulse 0.25s infinite alternate; }
        @keyframes warnPulse { 0% { opacity: 0.15; } 100% { opacity: 0.65; } }
        .plasmatron-beam { background: #ff003c; box-shadow: 0 0 25px #ff003c, 0 0 45px #ff003c; }

        #ready-banner { display: none; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); font-size: 36px; font-weight: 900; color: #ff003c; letter-spacing: 2px; animation: pulse 0.5s ease-in-out infinite alternate; z-index: 10; }
        @keyframes pulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }

        #scoreboard { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: bold; letter-spacing: 5px; opacity: 0.15; pointer-events: none; display: flex; gap: 15px; z-index: 4; }
        #score-player { color: #0056ff; }
        #score-divider { color: #000000; }
        #score-bot { color: #ff003c; }
        .epic-pulse { animation: epicPulseAnim 0.3s infinite alternate !important; opacity: 1 !important; font-size: 70px !important; }
        @keyframes epicPulseAnim { 0% { transform: translate(-50%, -50%) scale(0.85); color: #ff0059; } 100% { transform: translate(-50%, -50%) scale(1.25); color: #000000; } }
        
        .attack-button-obj { position: absolute; background: #2ecc71; border: 3px solid #27ae60; color: #ffffff; font-size: 11px; font-weight: bold; padding: 6px 10px; border-radius: 4px; box-shadow: 0 0 10px #2ecc71; cursor: pointer; z-index: 8; white-space: nowrap; }

        #settings-btn { position: absolute; top: 15px; right: 15px; width: 36px; height: 36px; background: #000000; color: #ffffff; border: 2px solid #000000; border-radius: 6px; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9999; transition: 0.2s; padding-bottom: 2px; }
        #settings-btn:hover { background: #222222; }
        #console-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 99999; justify-content: center; align-items: center; }
        .console-box { background: #ffffff; padding: 20px; border-radius: 8px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 2px solid #000000; text-align: center; }
        
        .input-row { display: flex; gap: 8px; width: 100%; margin-bottom: 10px; }
        #cheat-input { flex: 1; padding: 10px; border: 2px solid #000000; border-radius: 6px; font-size: 12px; outline: none; background: #fafafa; color: #000000; text-align: center; user-select: text !important; -webkit-user-select: text !important; }
        #submit-arrow-btn { width: 40px; height: 38px; background: #000000; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        #submit-arrow-btn:hover { background: #222222; }
        
        #screen-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; border: 4px solid #000; }
        #screen-overlay h2 { font-size: 28px; margin-bottom: 20px; }
        .btn { background: #000; color: #fff; border: none; padding: 12px 24px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; margin: 5px; transition: 0.2s; }
        .btn:hover { background: #333; }
        
        #countdown-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; border: 4px solid #000; }
        #countdown-number { font-size: 90px; font-weight: 900; color: #000000; transform: scale(1); transition: transform 0.2s ease-out; }
        
        #transition-curtain { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; z-index: 999999; }
        .spiral-block { position: absolute; width: 5vw; height: 5vh; background: #000000; transform: scale(0); transition: transform 0.3s ease-in-out; z-index: 9999999; }
    </style>
</head>
<body>

    <div id="game-stage">
        <video id="bg-video" src="file1b.mp4" loop muted playsinline></video>
        <button id="settings-btn">⏸</button>
        <div id="ready-banner">Are you ready?</div>
        
        <div id="left-ribbon" class="side-ribbon"><div id="left-track" class="ribbon-track"></div></div>
        <div id="right-ribbon" class="side-ribbon"><div id="right-track" class="ribbon-track"></div></div>
        
        <div id="plasma-zone" class="plasmatron-zone"></div>

        <div id="scoreboard">
            <span id="score-player">0</span>
            <span id="score-divider">:</span>
            <span id="score-bot">0</span>
        </div>
        <div id="player" class="paddle player-paddle"></div>
        <div id="bot" class="paddle bot-paddle"></div>
        <div id="ball">O</div>
        
        <div id="countdown-overlay">
            <div id="countdown-number">3</div>
        </div>
    </div>

    <div id="console-overlay">
        <div class="console-box">
            <div class="input-row">
                <input type="text" id="cheat-input" placeholder="" autocomplete="off">
                <button id="submit-arrow-btn">➔</button>
            </div>
            <button class="btn" id="console-restart-btn" style='font-size:12px; padding:8px 16px; background: #e74c3c;'>Рестарт</button>
            <button class="btn" id="console-close-btn" style='font-size:12px; padding:8px 16px; margin-top: 5px;'>Вернуться</button>
        </div>
    </div>
    <div id="screen-overlay">
        <h2 id="overlay-title">Вы проиграли!</h2>
        <button class="btn" id="retry-btn">Попробовать еще</button>
        <button class="btn" id="back-btn">Назад</button>
    </div>

    <div id="transition-curtain"></div>

    <script>
        let legends = [];
        let ordinaryPlayers = [];
        let playerScore = 0, botScore = 0;
        let animationFrameId = null;
        
        const stage = document.getElementById("game-stage");
        const playerEl = document.getElementById("player");
        const botEl = document.getElementById("bot");
        const ballEl = document.getElementById("ball");
        const scorePlayerEl = document.getElementById("score-player");
        const scoreBotEl = document.getElementById("score-bot");
        const overlay = document.getElementById("screen-overlay");
        const curtain = document.getElementById("transition-curtain");
        const readyBanner = document.getElementById("ready-banner");
        const settingsBtn = document.getElementById("settings-btn");
        const consoleOverlay = document.getElementById("console-overlay");
        const consoleCloseBtn = document.getElementById("console-close-btn");
        const consoleRestartBtn = document.getElementById("console-restart-btn");
        const cheatInput = document.getElementById("cheat-input");
        const submitArrowBtn = document.getElementById("submit-arrow-btn");
        const gameTitle = document.getElementById("game-title");
        const countdownOverlay = document.getElementById("countdown-overlay");
        const countdownNumber = document.getElementById("countdown-number");
        const bgVideo = document.getElementById("bg-video");
        const leftTrack = document.getElementById("left-track");
        const rightTrack = document.getElementById("right-track");
        const plasmaZone = document.getElementById("plasma-zone");
        
        let ballX = 440, ballY = 290, ballSpeedX = 4, ballSpeedY = 3;
        let playerX = 380, botX = 380;
        const paddleHeight = 35;
        let playerWidth = 120, botWidth = 120;
        let gameActive = false;
        let inPause = false;
        let godModeActive = false; 
        let isBotFrozen = false;

        let obstacles = [];
        let redOrbs = [];
        let ashParticles = [];
        
        let leftRibbonY = 0, rightRibbonY = 0;
        let orbSpeedMultiplier = 1.0;
        let playerPaddleHits = 0;

        let plasmaTimer = 0;
        let plasmaState = 0;
        let plasmaX = 0;
        let plasmaW = 0;
        let plasmaWarnCount = 0;

        let attackButton = null;
        let attackHits = 0;
        let nextAttackSpawnTime = 0;
        let isPadOverAttack = false;

        function sha256Sync(str) {
            var buffer = new TextEncoder().encode(str);
            var words = [];
            for (var i = 0; i < buffer.length; i++) { words[i >> 2] |= buffer[i] << (24 - (i % 4) * 8); }
            var asciiLength = buffer.length;
            var hash = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            var k = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
            words[asciiLength >> 2] |= 0x80 << (24 - (asciiLength % 4) * 8);
            while (((words.length * 4) % 64) !== 56) { words.push(0); }
            words.push(0); words.push(asciiLength * 8);
            for (var j = 0; j < words.length; j += 16) {
                var w = words.slice(j, j + 16); var oldHash = hash.slice(0);
                for (var i = 0; i < 64; i++) {
                    if (i >= 16) {
                        var w15 = w[i - 15], w2 = w[i - 2];
                        var s0 = ((w15>>>7)|(w15<<25)) ^ ((w15>>>18)|(w15<<14)) ^ (w15>>>3);
                        var s1 = ((w2>>>17)|(w2<<15)) ^ ((w2>>>19)|(w2<<13)) ^ (w2>>>10);
                        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
                    }
                    var a = hash, b = hash, c = hash, d = hash, e = hash, f = hash, g = hash, h = hash;
                    var S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
                    var ch = (e & f) ^ ((~e) & g);
                    var temp1 = (h + S1 + ch + k[i] + w[i]) | 0;
                    var S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
                    var maj = (a & b) ^ (a & c) ^ (b & c);
                    var temp2 = (S0 + maj) | 0;
                    hash = [(temp1 + temp2) | 0, a, b, c, (d + temp1) | 0, e, f, g];
                }
                for (var i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
            }
            return hash.map(function(val) { var s = (val >>> 0).toString(16); while (s.length < 8) s = '0' + s; return s; }).join('');
        }

        function runCountdown(callback) {
            inPause = true;
            countdownOverlay.style.display = "flex";
            let count = 3;
            countdownNumber.textContent = count;
            let timer = setInterval(() => {
                count--;
                if (count > 0) { countdownNumber.textContent = count; } 
                else { clearInterval(timer); countdownOverlay.style.display = "none"; inPause = false; if (callback) callback(); }
            }, 1000);
        }
        function executeCheatCheck() {
            const code = cheatInput.value.trim().toLowerCase();
            const hashed = sha256Sync(code);
            const cheatMap = {
                "3be059f032252a17088924b179294248aa6180a52df0fae627c2fe6681b95b87": () => { playerScore = 25; },
                "ea66f77ccb02e70e9a7e6ff8161b94ea9c07e05fc8645e7fdb0ea628f26db9cc": () => { playerScore = 50; },
                "d5d5945ec598f4e24ee7662c1be833efdcd38fe4b8b6f3a7633cc47da0cc3283": () => { playerScore = 100; },
                "cb25bfd33f7c32bf28d098e945fe96b1853da99bc6e7f223f6685fb1ee3ff5fb": () => { playerScore = 200; },
                "0f45512ae30c5e7b399ccbc4ca355df040a43057187c53e83918a5df9775be37": () => { playerScore = 249; },
                "d4eb20fc5ba98db5f40f09ee395dc3d97ba23c914da7dbca03b9b478335f606a": () => { playerScore = 250; },
                "d72d633e08fbe7d507b949fefee4a6136fa513da19bc0195ee88301cf1294875": () => { playerScore = 255; },
                "fcd48911bfdf013bfd3f18e95df1881cf71cf70ff22b8ff34f2d34199c0f994a": () => { godModeActive = true; },
                "a19ca4d9247eb97bd0b3294326532d56d9539d4825dd8b8352614b62095f9227": () => { godModeActive = false; },
                "ZnJlZXplYm90": () => { isBotFrozen = true; },
                "dW5mcmVlemVib3Q=": () => { isBotFrozen = false; }
            };
            if (cheatMap[hashed] !== undefined) {
                cheatMap[hashed]();
                scorePlayerEl.textContent = playerScore;
                updateBossEnvironment();
                clearHardcoreElements();
                resetPositions();
                ballEl.style.display = "flex";
            }
            consoleOverlay.style.display = "none"; cheatInput.value = ""; inPause = false;
        }

        submitArrowBtn.addEventListener("click", executeCheatCheck);
        cheatInput.addEventListener("keydown", e => { if (e.key === "Enter") executeCheatCheck(); });
        consoleRestartBtn.addEventListener("click", () => { consoleOverlay.style.display = "none"; cheatInput.value = ""; triggerFullReset(); });
        consoleCloseBtn.addEventListener("click", () => { consoleOverlay.style.display = "none"; cheatInput.value = ""; inPause = false; });

        async function initGame() {
            try {
                const r = await fetch("players.json?t=" + Date.now(), { cache: "no-store" });
                if (r.ok) {
                    const all = await r.json();
                    legends = all.filter(p => p.layer === 2 || p.description === "Легенда");
                    ordinaryPlayers = all.filter(p => p.layer !== 2 && p.description !== "Легенда");
                }
            } catch(e) { console.log(e); }
            
            if (legends.length === 0) { legends = [{ name: "Mendaly" }, { name: "SadFile" }, { name: "VOLONTER" }]; }
            if (ordinaryPlayers.length === 0) { ordinaryPlayers = [{ name: "Mokinas48888" }, { name: "faret2" }, { name: "vladimat5" }]; }
            
            playerEl.textContent = getRandomLegend();
            botEl.textContent = getRandomLegend();
            
            buildRibbons();
            
            setTimeout(() => {
                playerWidth = playerEl.offsetWidth || 120;
                botWidth = botEl.offsetWidth || 120;
                resetPositions();
                gameActive = true;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                runCountdown(() => {
                    animationFrameId = requestAnimationFrame(gameLoop);
                });
            }, 50);
        }

        function getRandomLegend() { return legends[Math.floor(Math.random() * legends.length)].name; }
        function getRandomOrdinary() { return ordinaryPlayers[Math.floor(Math.random() * ordinaryPlayers.length)].name; }

        function buildRibbons() {
            leftTrack.innerHTML = "";
            rightTrack.innerHTML = "";
            for (let i = 0; i < 40; i++) {
                let d1 = document.createElement("div");
                d1.textContent = getRandomLegend();
                leftTrack.appendChild(d1);
                
                let d2 = document.createElement("div");
                d2.textContent = getRandomLegend();
                rightTrack.appendChild(d2);
            }
        }

        function updateBossEnvironment() {
            if (playerScore >= 250) {
                stage.classList.add("boss-mode");
                gameTitle.textContent = "Преисподня";
                bgVideo.classList.add("active");
                bgVideo.play().catch(()=>{});
                document.getElementById("left-ribbon").style.display = "block";
                document.getElementById("right-ribbon").style.display = "block";
                
                if (ashParticles.length === 0) {
                    for (let i = 0; i < 35; i++) {
                        let el = document.createElement("div");
                        el.className = "ash-particle";
                        stage.appendChild(el);
                        ashParticles.push({
                            el: el,
                            x: Math.random() * 900,
                            y: Math.random() * 600,
                            speedX: (Math.random() * 1 - 0.5) * 0.7,
                            speedY: 0.5 + Math.random() * 1
                        });
                    }
                }
                
                if (playerScore === 255) {
                    nextAttackSpawnTime = Date.now() + (7000 + Math.random() * 23000);
                }
            } else {
                stage.classList.remove("boss-mode");
                gameTitle.textContent = "sandpex — Легендарный Пинг-Понг";
                bgVideo.classList.remove("active");
                bgVideo.pause();
                document.getElementById("left-ribbon").style.display = "none";
                document.getElementById("right-ribbon").style.display = "none";
                removeAsh();
                removeAttackButton();
                plasmaZone.style.display = "none";
                plasmaState = 0;
                botEl.style.filter = "none";
            }
        }

        function removeAsh() {
            ashParticles.forEach(p => p.el.remove());
            ashParticles = [];
        }

        function removeAttackButton() {
            if (attackButton) {
                attackButton.el.remove();
                attackButton = null;
            }
            isPadOverAttack = false;
        }

        function spawnAttackButton() {
            if (attackButton) return;
            let el = document.createElement("div");
            el.className = "attack-button-obj";
            el.textContent = "АТАКА";
            stage.appendChild(el);
            
            attackButton = {
                el: el,
                x: 200 + Math.random() * 500,
                y: 150 + Math.random() * 200,
                w: el.offsetWidth || 70,
                h: el.offsetHeight || 28,
                speedX: (Math.random() > 0.5 ? 0.4 : -0.4),
                speedY: (Math.random() > 0.5 ? 0.3 : -0.3),
                angle: 0,
                rotSpeed: (Math.random() * 0.4 - 0.2)
            };
        }

        function resetPositions() {
            ballX = 440; ballY = 290;
            ballSpeedX = (Math.random() > 0.5 ? 4 : -4);
            ballSpeedY = (Math.random() > 0.5 ? 3 : -3);
            if (playerScore >= 250) {
                ballSpeedX *= 1.3;
                ballSpeedY *= 1.3;
            }
            playerX = 450 - (playerWidth / 2);
            botX = 450 - (botWidth / 2);
            playerEl.style.left = playerX + "px";
            botEl.style.left = botX + "px";
            playerPaddleHits = 0;
            orbSpeedMultiplier = 1.0 + (playerScore - 250) * 0.05;
        }

        stage.addEventListener("mousemove", e => {
            if (!gameActive || inPause) return;
            const rect = stage.getBoundingClientRect();
            let relativeX = e.clientX - rect.left - (playerWidth / 2);
            playerX = Math.max(0, Math.min(900 - playerWidth, relativeX));
            playerEl.style.left = playerX + "px";
        });

        window.addEventListener("click", e => {
            if (!gameActive || inPause || playerScore !== 255 || !attackButton || !isPadOverAttack) return;
            
            attackHits++;
            removeAttackButton();
            nextAttackSpawnTime = Date.now() + (7000 + Math.random() * 23000);
            
            if (attackHits === 1) botEl.style.filter = "drop-shadow(0 0 2px #ff003c) blur(0.3px)";
            else if (attackHits === 2) botEl.style.filter = "drop-shadow(0 0 4px #ff003c) blur(0.6px)";
            else if (attackHits === 3) botEl.style.filter = "drop-shadow(0 0 6px #ff003c) contrast(1.5) blur(1px)";
            else if (attackHits === 4) botEl.style.filter = "drop-shadow(0 0 10px #ff003c) contrast(2) invert(0.2) blur(1.5px)";
            else if (attackHits >= 5) {
                triggerVictorySequence();
            }
        });

        function clearHardcoreElements() {
            obstacles.forEach(o => o.el.remove());
            redOrbs.forEach(o => o.el.remove());
            obstacles = []; redOrbs = [];
            plasmaZone.style.display = "none";
            plasmaState = 0;
            removeAttackButton();
        }
        function spawnObstacle() {
            if (playerScore < 250 || playerScore === 255 || obstacles.length >= 4) return;
            const el = document.createElement("div");
            el.className = "glitch-tag";
            el.textContent = getRandomOrdinary();
            stage.appendChild(el);

            const width = el.offsetWidth || 100;
            obstacles.push({
                el: el, x: Math.random() * (900 - width), y: 120 + Math.random() * 250,
                width: width, height: 30,
                speedX: (Math.random() * 2 - 1) * 1.5, speedY: (Math.random() * 2 - 1) * 0.8,
                angle: Math.random() * 360, rotSpeed: (Math.random() * 2 - 1) * 1.2
            });
        }

        function spawnRedOrb() {
            if (playerScore < 250 || redOrbs.length >= 3) return;
            const el = document.createElement("div");
            el.className = "red-orb"; el.textContent = "O";
            stage.appendChild(el);

            redOrbs.push({ el: el, x: Math.random() * 880, y: 0, speedY: (1.2 + Math.random() * 1.5) * orbSpeedMultiplier });
        }

        function getBotSpeed() {
            if (playerScore === 255) return 40.0;
            if (playerScore >= 250) return 12.0 + (playerScore - 250) * 0.15;
            if (playerScore >= 200) return 6.0;
            if (playerScore >= 100) return 5.2;
            if (playerScore >= 50)  return 4.5;
            if (playerScore >= 25)  return 3.8;
            return 3.2;
        }

        function triggerVictorySequence() {
            gameActive = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            clearHardcoreElements();
            removeAsh();
            ballEl.style.display = "none";
            botEl.style.display = "none";
            
            playerScore = 256;
            scorePlayerEl.textContent = "256";
            scorePlayerEl.className = "epic-pulse";
            scoreBotEl.className = "epic-pulse";
            
            readyBanner.textContent = "YOU WIN";
            readyBanner.style.display = "block";
            
            setTimeout(() => {
                triggerSpiralCurtain();
            }, 2000);
        }

        function triggerSpiralCurtain() {
            curtain.style.display = "block";
            curtain.innerHTML = "";
            
            const cols = 20;
            const rows = 12;
            const blockW = 900 / cols;
            const blockH = 600 / rows;
            
            let order = [];
            let top = 0, bottom = rows - 1, left = 0, right = cols - 1;
            
            while (top <= bottom && left <= right) {
                for (let i = left; i <= right; i++) order.push({r: top, c: i});
                top++;
                for (let i = top; i <= bottom; i++) order.push({r: i, c: right});
                right--;
                if (top <= bottom) {
                    for (let i = right; i >= left; i--) order.push({r: bottom, c: i});
                    bottom--;
                }
                if (left <= right) {
                    for (let i = bottom; i >= top; i--) order.push({r: i, c: left});
                    left++;
                }
            }
            
            order.forEach((pos, index) => {
                let div = document.createElement("div");
                div.className = "spiral-block";
                div.style.width = blockW + "px";
                div.style.height = blockH + "px";
                div.style.left = (pos.c * blockW) + "px";
                div.style.top = (pos.r * blockH) + "px";
                curtain.appendChild(div);
                
                setTimeout(() => {
                    div.style.transform = "scale(1.05)";
                    if (index === order.length - 1) {
                        setTimeout(() => {
                            window.location.href = "file2.html";
                        }, 600);
                    }
                }, index * 15);
            });
        }
        function handleGoal(isPlayerGoal) {
            inPause = true;
            if (isPlayerGoal) {
                playerScore++;
                scorePlayerEl.textContent = playerScore;
            } else {
                botScore++;
                scoreBotEl.textContent = botScore;
            }

            ballEl.style.display = "none";
            clearHardcoreElements();

            if (botScore === 5 && !godModeActive) {
                gameActive = false;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.getElementById("overlay-title").textContent = "Вы проиграли!";
                overlay.style.display = "flex";
                return;
            }

            if (playerScore >= 256) {
                triggerVictorySequence();
                return;
            }

            let delay = 1000;
            if (playerScore === 250 && isPlayerGoal) {
                delay = 3000;
                readyBanner.style.display = "block";
                updateBossEnvironment();
            }

            setTimeout(() => {
                readyBanner.style.display = "none";
                playerEl.textContent = getRandomLegend();
                botEl.textContent = getRandomLegend();
                
                setTimeout(() => {
                    playerWidth = playerEl.offsetWidth || 120;
                    botWidth = botEl.offsetWidth || 120;
                    
                    resetPositions();
                    ballEl.style.display = "flex";
                    inPause = false;
                }, 20);
            }, delay); 
        }

        function gameLoop() {
            if (!gameActive) return;

            if (!inPause) {
                ballX += ballSpeedX;
                ballY += ballSpeedY;

                if (ballX <= 0 || ballX >= 880) {
                    ballSpeedX = -ballSpeedX;
                    if (ballX < 0) ballX = 0;
                    if (ballX > 880) ballX = 880;
                }
                if (playerScore >= 250) {
                    leftRibbonY -= 1.5; if (leftRibbonY <= -400) leftRibbonY = 0;
                    rightRibbonY += 1.5; if (rightRibbonY >= 400) rightRibbonY = 0;
                    leftTrack.style.transform = `translateY(${leftRibbonY}px)`;
                    rightTrack.style.transform = `translateY(${rightRibbonY}px)`;
                    
                    ashParticles.forEach(p => {
                        p.x += p.speedX; p.y += p.speedY;
                        if (p.y > 600) { p.y = -10; p.x = Math.random() * 900; }
                        if (p.x < 0 || p.x > 900) p.speedX = -p.speedX;
                        p.el.style.left = p.x + "px"; p.el.style.top = p.y + "px";
                    });

                    if (Math.random() < 0.005) spawnObstacle();
                    if (Math.random() < 0.008) spawnRedOrb();

                    if (playerScore >= 253 && playerScore <= 255) {
                        plasmaTimer += 16.66;
                        let interval = 4000;
                        if (playerScore === 254) {
                            interval = Math.max(1500, 4000 - Math.floor(playerPaddleHits / 5) * 400);
                        } else if (playerScore === 255) {
                            interval = 2800;
                        }

                        if (plasmaState === 0 && plasmaTimer >= interval) {
                            plasmaState = 1; plasmaTimer = 0; plasmaWarnCount = 0;
                            plasmaX = Math.random() * 600;
                            let fraction = 0.25;
                            if (playerScore === 254) fraction = 0.25 + Math.random() * (1/3 - 0.25);
                            else if (playerScore === 255) fraction = 0.5;
                            plasmaW = 900 * fraction;
                            
                            plasmaZone.style.left = plasmaX + "px";
                            plasmaZone.style.width = plasmaW + "px";
                            plasmaZone.className = "plasmatron-zone plasmatron-warn pulse-glow";
                            plasmaZone.textContent = "⚠️";
                            plasmaZone.style.display = "block";
                        } else if (plasmaState === 1) {
                            if (plasmaTimer >= 500) {
                                plasmaTimer = 0; plasmaWarnCount++;
                                if (plasmaWarnCount >= 3) {
                                    plasmaState = 2;
                                    plasmaZone.className = "plasmatron-zone plasmatron-beam";
                                    plasmaZone.textContent = "";
                                }
                            }
                        } else if (plasmaState === 2) {
                            if (playerX + playerWidth >= plasmaX && playerX <= plasmaX + plasmaW) {
                                if (!godModeActive) {
                                    gameActive = false;
                                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                                    clearHardcoreElements();
                                    document.getElementById("overlay-title").textContent = "Испепелено плазматроном!";
                                    overlay.style.display = "flex";
                                    return;
                                }
                            }
                            if (plasmaTimer >= 600) {
                                plasmaZone.style.display = "none";
                                plasmaState = 0; plasmaTimer = 0;
                            }
                        }
                    }

                    if (playerScore === 255) {
                        if (!attackButton && Date.now() >= nextAttackSpawnTime) {
                            spawnAttackButton();
                        }
                        if (attackButton) {
                            attackButton.x += attackButton.speedX;
                            attackButton.y += attackButton.speedY;
                            attackButton.angle += attackButton.rotSpeed;
                            
                            if (attackButton.x <= 100 || attackButton.x >= 800 - attackButton.w) attackButton.speedX = -attackButton.speedX;
                            if (attackButton.y <= 120 || attackButton.y >= 450) attackButton.speedY = -attackButton.speedY;
                            
                            attackButton.el.style.left = attackButton.x + "px";
                            attackButton.el.style.top = attackButton.y + "px";
                            attackButton.el.style.transform = `rotate(${attackButton.angle}deg)`;
                            
                            if (attackButton.y + attackButton.h >= 535 && attackButton.y <= 570 && 
                                attackButton.x + attackButton.w >= playerX && attackButton.x <= playerX + playerWidth) {
                                isPadOverAttack = true;
                                attackButton.el.style.background = "#27ae60";
                            } else {
                                isPadOverAttack = false;
                                attackButton.el.style.background = "#2ecc71";
                            }
                        }
                    }
                }

                obstacles.forEach(o => {
                    o.x += o.speedX; o.y += o.speedY; o.angle += o.rotSpeed;
                    if (o.x <= 0 || o.x >= 900 - o.width) o.speedX = -o.speedX;
                    if (o.y <= 100 || o.y >= 400) o.speedY = -o.speedY;
                    o.el.style.left = o.x + "px"; o.el.style.top = o.y + "px";
                    o.el.style.transform = `rotate(${o.angle}deg)`;
                    if (ballX + 20 >= o.x && ballX <= o.x + o.width && ballY + 20 >= o.y && ballY <= o.y + o.height) {
                        ballSpeedY = -ballSpeedY; ballSpeedX += (Math.random() * 2 - 1) * 2; 
                    }
                });

                for (let i = redOrbs.length - 1; i >= 0; i--) {
                    let orb = redOrbs[i]; orb.y += orb.speedY;
                    orb.el.style.left = orb.x + "px"; orb.el.style.top = orb.y + "px";
                    if (orb.y + 18 >= 535 && orb.y <= 570 && orb.x + 18 >= playerX && orb.x <= playerX + playerWidth) {
                        if (!godModeActive) {
                            gameActive = false; if (animationFrameId) cancelAnimationFrame(animationFrameId);
                            orb.el.remove(); clearHardcoreElements();
                            document.getElementById("overlay-title").textContent = "Вы поймали сферу смерти!";
                            overlay.style.display = "flex"; return;
                        } else {
                            orb.el.remove(); redOrbs.splice(i, 1);
                        }
                    }
                    if (orb.y > 600) { orb.el.remove(); redOrbs.splice(i, 1); }
                }

                if (!isBotFrozen) {
                    let botCenter = botX + (botWidth / 2);
                    let ballCenter = ballX + 10;
                    let botSpeed = getBotSpeed();
                    if (ballSpeedY < 0) {
                        if (botCenter < ballCenter - 8) botX += botSpeed;
                        else if (botCenter > ballCenter + 8) botX -= botSpeed;
                        botX = Math.max(0, Math.min(900 - botWidth, botX)); botEl.style.left = botX + "px";
                    }
                }

                if (ballSpeedY < 0 && ballY <= 65 && ballY >= 30) {
                    if (ballX + 20 >= botX && ballX <= botX + botWidth) {
                        ballSpeedY = -ballSpeedY * 1.03;
                        let hitPoint = (ballX + 10 - (botX + botWidth / 2)) / (botWidth / 2);
                        ballSpeedX += hitPoint * 3; ballY = 66; 
                    }
                }

                if (ballSpeedY > 0 && ballY + 20 >= 535 && ballY <= 570) {
                    if (ballX + 20 >= playerX && ballX <= playerX + playerWidth) {
                        ballSpeedY = -ballSpeedY * 1.03;
                        let hitPoint = (ballX + 10 - (playerX + playerWidth / 2)) / (playerWidth / 2);
                        ballSpeedX += hitPoint * 3; ballY = 514; 
                        playerPaddleHits++;
                    }
                }

                if (ballY < 0) handleGoal(true); 
                else if (ballY > 600) handleGoal(false); 
            }

            ballEl.style.left = ballX + "px";
            ballEl.style.top = ballY + "px";

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        document.getElementById("retry-btn").addEventListener("click", triggerFullReset);
        document.getElementById("back-btn").addEventListener("click", () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            clearHardcoreElements(); removeAsh(); window.location.href = "index.html";
        });

        initGame();
    </script>
</body>
</html>
