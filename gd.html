<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash — HTML5 Edition</title>
    <style>
        @font-face {
            font-family: 'Minecraftia';
            src: url('https://cdnfonts.com') format('woff');
            font-weight: normal; font-style: normal;
        }
        * { box-sizing: border-box; font-family: 'Minecraftia', sans-serif !important; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; }
        
        #gd-game-stage { width: 900px; height: 600px; border: 4px solid #000000; position: relative; background: #ffffff; overflow: hidden; box-shadow: 0 10px 35px rgba(0,0,0,0.1); }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #main-menu-screen { display: flex; background: #ffffff; }
        
        .menu-title { font-size: 32px; font-weight: bold; margin-bottom: 40px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .menu-buttons-container { display: flex; align-items: center; gap: 30px; }
        
        .main-btn { background: #000000; color: #ffffff; border: 3px solid #000000; font-weight: bold; cursor: pointer; transition: 0.2s ease; display: flex; align-items: center; justify-content: center; text-align: center; }
        .main-btn:hover { background: #ffffff; color: #000000; }
        
        #play-btn-center { width: 150px; height: 150px; border-radius: 50%; font-size: 20px; text-transform: uppercase; }
        #editor-btn-left, #dev-btn-right { width: 90px; height: 90px; border-radius: 12px; font-size: 11px; text-transform: uppercase; }
        #dev-btn-right { background: #ffffff; color: #000000; }
        #dev-btn-right:hover { background: #000000; color: #ffffff; }
        
        #play-screen { background: #ffffff; }
        .level-selector-row { display: flex; align-items: center; justify-content: center; gap: 40px; width: 100%; height: 100%; position: relative; }
        .nav-arrow { width: 50px; height: 50px; border: 3px solid #000000; background: #ffffff; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: 0.15s; z-index: 10; }
        .nav-arrow:hover { background: #000000; color: #ffffff; }
        .level-card { width: 400px; height: 280px; border: 4px solid #000000; border-radius: 12px; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .level-card h3 { font-size: 22px; margin-bottom: 12px; text-transform: uppercase; }
        .level-card p { font-size: 12px; color: #555555; margin-bottom: 25px; }
        
        #editor-screen { background: #ffffff; flex-direction: row; align-items: stretch; padding: 0; }
        #editor-canvas { background: #fafafa; cursor: crosshair; }
        .editor-sidebar { width: 220px; border-left: 4px solid #000000; display: flex; flex-direction: column; background: #ffffff; padding: 15px; justify-content: space-between; }
        
        .editor-panel-box { background: #ffffff; border: 2px solid #000000; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        .editor-tab-row { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 2px solid #000000; padding-bottom: 5px; }
        .tab-btn { flex: 1; padding: 6px 0; font-size: 10px; font-weight: bold; border: 2px solid #000000; background: #ffffff; cursor: pointer; text-transform: uppercase; text-align: center; border-radius: 4px; }
        .tab-btn.active { background: #000000; color: #ffffff; }
        
        .palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .palette-item { aspect-ratio: 1; border: 2px solid #000000; background: #ffffff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: bold; border-radius: 4px; text-align: center; padding: 2px; text-transform: uppercase; }
        .palette-item.active { background: #eeeeee; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
        .palette-item span { font-size: 13px; margin-bottom: 2px; }
        
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .action-btn { padding: 6px 0; font-size: 10px; font-weight: bold; border: 2px solid #000000; background: #ffffff; cursor: pointer; border-radius: 4px; text-transform: uppercase; text-align: center; }
        .action-btn:hover { background: #000000; color: #ffffff; }
        
        #editor-top-bar { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; z-index: 50; }
        .top-bar-btn { height: 36px; padding: 0 15px; font-size: 11px; font-weight: bold; border: 2px solid #000000; background: #ffffff; cursor: pointer; border-radius: 6px; text-transform: uppercase; display: flex; align-items: center; }
        .top-bar-btn:hover { background: #000000; color: #ffffff; }
        
        #editor-pause-overlay, #game-pause-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.96); z-index: 200; flex-direction: column; justify-content: center; align-items: center; border: 4px solid #000000; }
        #editor-pause-overlay h2, #game-pause-overlay h2 { font-size: 26px; margin-bottom: 20px; text-transform: uppercase; }
        .pause-box { border: 3px solid #000000; background: #fafafa; padding: 20px; border-radius: 8px; width: 340px; margin-bottom: 20px; }
        .pause-stat-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
        
        .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; border-top: 1px dashed #000; padding-top: 12px; }
        .toggle-label { font-size: 12px; font-weight: bold; }
        .toggle-switch { width: 44px; height: 24px; background: #e0e0e0; border: 2px solid #000000; border-radius: 12px; position: relative; cursor: pointer; transition: 0.2s; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #000000; border-radius: 50%; transition: 0.2s; }
        .toggle-switch.active { background: #2ecc71; }
        .toggle-switch.active::after { left: 22px; background: #ffffff; }
    </style>
</head>
        <div class="screen" id="play-screen">
            <div id="editor-top-bar" style="top:20px; left:20px;">
                <button class="top-bar-btn" id="exit-selector-btn">◀ Меню</button>
            </div>
            <div class="level-selector-row">
                <button class="nav-arrow" id="prev-lvl-btn">◀</button>
                <div class="level-card" id="level-card-view"></div>
                <button class="nav-arrow" id="next-lvl-btn">▶</button>
            </div>
        </div>

        <div class="screen" id="editor-screen">
            <div id="editor-top-bar">
                <button class="top-bar-btn" id="editor-test-btn">▶ Тест</button>
                <button class="top-bar-btn" id="editor-download-btn">⬇ Скачать</button>
                <button class="top-bar-btn" id="editor-exit-btn">◀ Выйти</button>
            </div>
            <div style="position:absolute; top:15px; right:245px; z-index:50;">
                <button class="top-bar-btn" id="editor-pause-btn">⏸</button>
            </div>
            <canvas id="editor-canvas" width="676" height="600"></canvas>
            <div class="editor-sidebar">
                <div>
                    <div class="editor-tab-row">
                        <button class="tab-btn active" id="tab-build">Build</button>
                        <button class="tab-btn" id="tab-edit">Edit</button>
                        <button class="tab-btn" id="tab-delete">Delete</button>
                    </div>
                    
                    <div class="editor-panel-box" id="panel-build" style="max-height: 400px; overflow-y: auto;">
                        <div class="palette-grid">
                            <button class="palette-item active" data-type="1"><span>⬜</span>Блок</button>
                            <button class="palette-item" data-type="2"><span>▲</span>Шип</button>
                            <button class="palette-item" data-type="3"><span>⚙</span>Пила</button>
                            <button class="palette-item" data-type="4"><span>▬</span>Ж.Пад</button>
                            <button class="palette-item" data-type="5"><span>〇</span>Ж.Орб</button>
                            <button class="palette-item" data-type="6"><span>▬</span>С.Пад</button>
                            <button class="palette-item" data-type="7"><span>〇</span>С.Орб</button>
                            <button class="palette-item" data-type="8"><span>⧉</span>Ж.Порт</button>
                            <button class="palette-item" data-type="9"><span>⧉</span>С.Порт</button>
                            <button class="palette-item" data-type="10"><span>⧉</span>Р.Порт</button>
                            <button class="palette-item" data-type="11"><span>⧉</span>З.Порт</button>
                        </div>
                    </div>
                    
                    <div class="editor-panel-box" id="panel-edit" style="display:none;">
                        <div class="action-grid">
                            <button class="action-btn" id="act-copy">Copy</button>
                            <button class="action-btn" id="act-paste">Paste</button>
                            <button class="action-btn" id="act-copypaste" style="font-size:9px;">Copy+Paste</button>
                            <button class="action-btn" id="act-edit-obj" style="background:#e67e22; color:#fff; border-color:#e67e22;">Edit Obj</button>
                        </div>
                    </div>

                    <div class="editor-panel-box" id="panel-delete" style="display:none;">
                        <p style="font-size:10px; text-align:center; color:#555; padding:10px 0;">Кликните на объект для удаления</p>
                    </div>
                </div>
                
                <div class="editor-panel-box" style="margin-bottom:0;">
                    <div class="stat-label">Редактор</div>
                    <div style="font-size:10px; color:#333; line-height:1.4; margin-top:4px;">Сетка: 30px<br>Привязка по клеткам</div>
                </div>
            </div>
        </div>

        <div id="editor-pause-overlay">
            <h2>Настройки редактора</h2>
            <div class="pause-box">
                <div class="pause-stat-line"><span>Всего объектов:</span><span id="stat-obj-count">0</span></div>
                <div class="toggle-container">
                    <span class="toggle-label">Бессмертие (God Mode)</span>
                    <div class="toggle-switch" id="toggle-god-mode"></div>
                </div>
            </div>
            <button class="btn" id="editor-resume-btn" style="width:200px;">Продолжить</button>
        </div>

        <div id="game-pause-overlay">
            <h2>Пауза уровня</h2>
            <button class="btn" id="game-resume-btn" style="width:200px; margin-bottom:10px;">Продолжить</button>
            <button class="btn" id="game-exit-btn" style="width:200px; background:#e74c3c; border-color:#e74c3c;">Выйти</button>
        </div>
    </div>

    <script>
        const BLOCK_SIZE = 30;
        const FPS = 60;
        const FRAME_TIME = 1000 / FPS;

        let currentScreen = "main-menu";
        let isGodMode = false;
        let localLevels = [];
        let currentLevelIdx = 0;
        
        let editorObjects = [];
        let activeTab = "build";
        let selectedBlockType = 1;
        let selectedObjectForEdit = null;
        let clipboardObject = null;
        
        let gameActive = false;
        let gameObjects = [];
        let particles = [];
        
        let player = { 
            x: 50, y: 300, vx: 5.5, vy: 0, rotation: 0, width: 24, height: 24, 
            isGrounded: false, jumpHold: false, isRotating: false, rotTarget: 0,
            gravitySign: 1, mode: "cube" 
        };
        let cameraX = 0;
        
        let GRAVITY = 1.41;
        const JUMP_IMPULSE = -14.2;
        const MAX_FALL_SPEED = 18;

        const legendsColors = ["#e74c3c", "#9b59b6", "#3498db", "#e67e22", "#1abc9c", "#f1c40f", "#2ecc71"];

        function initData() {
            try {
                let saved = localStorage.getItem("gd_custom_levels");
                if (saved) localLevels = JSON.parse(saved);
            } catch(e) { console.log(e); }
            
            if (localLevels.length === 0) {
                localLevels = [];
            }
        }
        const menuScreen = document.getElementById("main-menu-screen");
        const playScreen = document.getElementById("play-screen");
        const editorScreen = document.getElementById("editor-screen");
        const levelCardView = document.getElementById("level-card-view");
        const editorCanvas = document.getElementById("editor-canvas");
        const editorCtx = editorCanvas.getContext("2d");

        function switchScreen(screenName) {
            currentScreen = screenName;
            menuScreen.style.display = "none";
            playScreen.style.display = "none";
            editorScreen.style.display = "none";
            
            if (screenName === "main-menu") {
                menuScreen.style.display = "flex";
            } else if (screenName === "play") {
                playScreen.style.display = "flex";
                renderLevelCard();
            } else if (screenName === "editor") {
                editorScreen.style.display = "flex";
                resizeEditorCanvas();
                drawEditor();
            }
        }

        function renderLevelCard() {
            if (localLevels.length === 0 || currentLevelIdx < 0 || currentLevelIdx >= localLevels.length) {
                levelCardView.innerHTML = `<h3>Скоро...</h3><p>Новые испытания в разработке</p>`;
                return;
            }
            let lvl = localLevels[currentLevelIdx];
            levelCardView.innerHTML = `
                <h3>${lvl.name}</h3>
                <p>Создатель: ${lvl.creator}<br>Объектов: ${lvl.objects.length}</p>
                <button class="btn" id="start-level-game-btn" style="width:160px;">СТАРТ</button>
            `;
            document.getElementById("start-level-game-btn").addEventListener("click", () => {
                startActualGame(lvl.objects);
            });
        }

        document.getElementById("prev-lvl-btn").addEventListener("click", () => {
            if (localLevels.length === 0) return;
            if (currentLevelIdx > 0) { currentLevelIdx--; renderLevelCard(); }
            else { levelCardView.innerHTML = `<h3>Скоро...</h3><p>Конец списка уровней</p>`; }
        });

        document.getElementById("next-lvl-btn").addEventListener("click", () => {
            if (localLevels.length === 0) return;
            if (currentLevelIdx < localLevels.length - 1) { currentLevelIdx++; renderLevelCard(); }
            else { currentLevelIdx = localLevels.length; levelCardView.innerHTML = `<h3>Скоро...</h3><p>Конец списка уровней</p>`; }
        });

        function resizeEditorCanvas() {
            editorCanvas.width = 676;
            editorCanvas.height = 600;
        }

        function drawEditor() {
            editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
            editorCtx.strokeStyle = "rgba(0,0,0,0.06)";
            editorCtx.lineWidth = 1;
            
            for (let x = 0; x < editorCanvas.width; x += BLOCK_SIZE) {
                editorCtx.beginPath(); editorCtx.moveTo(x, 0); editorCtx.lineTo(x, editorCanvas.height); editorCtx.stroke();
            }
            for (let y = 0; y < editorCanvas.height; y += BLOCK_SIZE) {
                editorCtx.beginPath(); editorCtx.moveTo(0, y); editorCtx.lineTo(editorCanvas.width, y); editorCtx.stroke();
            }
            
            editorCtx.strokeStyle = "#000000";
            editorCtx.lineWidth = 3;
            editorCtx.beginPath(); editorCtx.moveTo(0, 480); editorCtx.lineTo(editorCanvas.width, 480); editorCtx.stroke();

            editorObjects.forEach(obj => {
                drawObjectOnCanvas(editorCtx, obj);
                if (activeTab === "edit" && selectedObjectForEdit === obj) {
                    editorCtx.strokeStyle = "#ff003c"; editorCtx.lineWidth = 2;
                    editorCtx.strokeRect(obj.x, obj.y, BLOCK_SIZE, BLOCK_SIZE);
                }
            });
        }

        function drawObjectOnCanvas(ctx, obj) {
            let col = obj.color || "#000000";
            ctx.save();
            if (obj.type === 1 || obj.type === 2) {
                ctx.shadowColor = col;
                ctx.shadowBlur = 10;
            }
            ctx.fillStyle = col;

            if (obj.type === 1) {
                ctx.fillRect(obj.x, obj.y, BLOCK_SIZE, BLOCK_SIZE);
            } else if (obj.type === 2) {
                ctx.beginPath(); ctx.moveTo(obj.x, obj.y + BLOCK_SIZE); ctx.lineTo(obj.x + BLOCK_SIZE / 2, obj.y); ctx.lineTo(obj.x + BLOCK_SIZE, obj.y + BLOCK_SIZE); ctx.closePath(); ctx.fill();
            } else if (obj.type === 3) {
                ctx.beginPath(); ctx.arc(obj.x + BLOCK_SIZE / 2, obj.y + BLOCK_SIZE / 2, BLOCK_SIZE / 2 - 2, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(obj.x + BLOCK_SIZE / 2, obj.y + BLOCK_SIZE / 2, BLOCK_SIZE / 4, 0, Math.PI * 2); ctx.stroke();
            } else if (obj.type === 4) {
                ctx.fillStyle = "#f1c40f"; ctx.fillRect(obj.x, obj.y + BLOCK_SIZE - 6, BLOCK_SIZE, 6);
            } else if (obj.type === 5) {
                ctx.fillStyle = "#f1c40f"; ctx.beginPath(); ctx.arc(obj.x + BLOCK_SIZE / 2, obj.y + BLOCK_SIZE / 2, BLOCK_SIZE / 3, 0, Math.PI * 2); ctx.fill();
            } else if (obj.type === 6) {
                ctx.fillStyle = "#3498db"; ctx.fillRect(obj.x, obj.y + BLOCK_SIZE - 6, BLOCK_SIZE, 6);
            } else if (obj.type === 7) {
                ctx.fillStyle = "#3498db"; ctx.beginPath(); ctx.arc(obj.x + BLOCK_SIZE / 2, obj.y + BLOCK_SIZE / 2, BLOCK_SIZE / 3, 0, Math.PI * 2); ctx.fill();
            } else if (obj.type === 8) {
                ctx.fillStyle = "#f1c40f"; ctx.fillRect(obj.x + BLOCK_SIZE / 3, obj.y, BLOCK_SIZE / 3, BLOCK_SIZE);
            } else if (obj.type === 9) {
                ctx.fillStyle = "#3498db"; ctx.fillRect(obj.x + BLOCK_SIZE / 3, obj.y, BLOCK_SIZE / 3, BLOCK_SIZE);
            } else if (obj.type === 10) {
                ctx.fillStyle = "#ff6b81"; ctx.fillRect(obj.x + BLOCK_SIZE / 3, obj.y, BLOCK_SIZE / 3, BLOCK_SIZE);
            } else if (obj.type === 11) {
                ctx.fillStyle = "#2ecc71"; ctx.fillRect(obj.x + BLOCK_SIZE / 3, obj.y, BLOCK_SIZE / 3, BLOCK_SIZE);
            }
            ctx.restore();
        }

        editorCanvas.addEventListener("click", e => {
            const rect = editorCanvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const cellX = Math.floor(mouseX / BLOCK_SIZE) * BLOCK_SIZE;
            const cellY = Math.floor(mouseY / BLOCK_SIZE) * BLOCK_SIZE;

            let existingIndex = editorObjects.findIndex(o => o.x === cellX && o.y === cellY);

            if (activeTab === "build") {
                if (existingIndex !== -1) editorObjects.splice(existingIndex, 1);
                editorObjects.push({ type: selectedBlockType, x: cellX, y: cellY, color: "#000000" });
            } else if (activeTab === "edit") {
                if (existingIndex !== -1) selectedObjectForEdit = editorObjects[existingIndex];
                else selectedObjectForEdit = null;
            } else if (activeTab === "delete") {
                if (existingIndex !== -1) editorObjects.splice(existingIndex, 1);
            }
            drawEditor();
        });
        document.getElementById("act-copy").addEventListener("click", () => {
            if (selectedObjectForEdit) {
                clipboardObject = { ...selectedObjectForEdit };
            }
        });

        document.getElementById("act-paste").addEventListener("click", () => {
            if (clipboardObject) {
                let existingIndex = editorObjects.findIndex(o => o.x === clipboardObject.x && o.y === clipboardObject.y);
                if (existingIndex === -1) {
                    editorObjects.push({ ...clipboardObject });
                    drawEditor();
                }
            }
        });

        document.getElementById("act-copypaste").addEventListener("click", () => {
            if (selectedObjectForEdit) {
                clipboardObject = { ...selectedObjectForEdit };
                clipboardObject.x += BLOCK_SIZE;
                let existingIndex = editorObjects.findIndex(o => o.x === clipboardObject.x && o.y === clipboardObject.y);
                if (existingIndex === -1) {
                    editorObjects.push({ ...clipboardObject });
                    selectedObjectForEdit = editorObjects[editorObjects.length - 1];
                    drawEditor();
                }
            }
        });

        document.getElementById("act-edit-obj").addEventListener("click", () => {
            if (selectedObjectForEdit) {
                let curColorIdx = legendsColors.indexOf(selectedObjectForEdit.color);
                let nextColorIdx = (curColorIdx + 1) % legendsColors.length;
                selectedObjectForEdit.color = legendsColors[nextColorIdx];
                drawEditor();
            }
        });

        let gameCanvas = null;
        let gameCtx = null;
        let gameLoopId = null;

        function spawnBurstParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: 2 + Math.random() * 3,
                    alpha: 1,
                    fade: 0.03 + Math.random() * 0.02,
                    color: color
                });
            }
        }
        function startActualGame(lvlObjects) {
            gameActive = true;
            gameObjects = JSON.parse(JSON.stringify(lvlObjects));
            particles = [];
            
            if (!gameCanvas) {
                gameCanvas = document.createElement("canvas");
                gameCanvas.id = "game-play-canvas";
                gameCanvas.width = 900; gameCanvas.height = 600;
                gameCanvas.style.position = "absolute";
                gameCanvas.style.top = "0"; gameCanvas.style.left = "0";
                gameCanvas.style.zIndex = "150"; gameCanvas.style.background = "#ffffff";
                document.getElementById("gd-game-stage").appendChild(gameCanvas);
                gameCtx = gameCanvas.getContext("2d");
            }
            gameCanvas.style.display = "block";

            player = { 
                x: 50, y: 456, vx: 5.5, vy: 0, rotation: 0, width: 24, height: 24, 
                isGrounded: true, jumpHold: false, isRotating: false, rotTarget: 0,
                gravitySign: 1, mode: "cube" 
            };
            cameraX = 0;

            window.addEventListener("keydown", handleGameControls);
            window.addEventListener("keyup", handleGameControlsUp);

            if (gameLoopId) clearInterval(gameLoopId);
            gameLoopId = setInterval(gameUpdateLoop, FRAME_TIME);
        }

        function handleGameControls(e) {
            if (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
                player.jumpHold = true;
            }
            if (e.key === "Escape") {
                clearInterval(gameLoopId);
                document.getElementById("game-pause-overlay").style.display = "flex";
            }
        }

        function handleGameControlsUp(e) {
            if (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
                player.jumpHold = false;
            }
        }

        function gameUpdateLoop() {
            player.x += player.vx;
            
            if (player.mode === "ship") {
                let thrust = player.jumpHold ? -0.38 * player.gravitySign : 0.38 * player.gravitySign;
                player.vy += thrust;
                let cap = 6;
                if (player.vy > cap) player.vy = cap;
                if (player.vy < -cap) player.vy = -cap;
            } else {
                player.vy += GRAVITY * player.gravitySign;
                if (player.gravitySign === 1 && player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;
                if (player.gravitySign === -1 && player.vy < -MAX_FALL_SPEED) player.vy = -MAX_FALL_SPEED;
            }
            
            player.y += player.vy;

            let onSolid = false;
            let groundY = (player.gravitySign === 1) ? 456 : 0;
            
            if (player.gravitySign === 1 && player.y >= 456) {
                player.y = 456; player.vy = 0; onSolid = true;
            } else if (player.gravitySign === -1 && player.y <= 0) {
                player.y = 0; player.vy = 0; onSolid = true;
            }

            let playerSolidBox = { x: player.x, y: player.y, w: player.width, h: player.height };
            if (player.mode === "ship") {
                playerSolidBox = { x: player.x + 5, y: player.y + 7, w: 14, h: 10 };
            }

            for (let i = 0; i < gameObjects.length; i++) {
                let obj = gameObjects[i];
                if (obj.type === 1) {
                    if (playerSolidBox.x + playerSolidBox.w > obj.x && playerSolidBox.x < obj.x + BLOCK_SIZE) {
                        if (player.gravitySign === 1) {
                            if (playerSolidBox.y + playerSolidBox.h >= obj.y && playerSolidBox.y + playerSolidBox.h <= obj.y + 8 && player.vy >= 0) {
                                player.y = obj.y - player.height; player.vy = 0; onSolid = true;
                            } else if (playerSolidBox.y < obj.y + BLOCK_SIZE && playerSolidBox.y + playerSolidBox.h > obj.y) {
                                if (!isGodMode) handlePlayerDeath();
                            }
                        } else {
                            if (playerSolidBox.y <= obj.y + BLOCK_SIZE && playerSolidBox.y >= obj.y + BLOCK_SIZE - 8 && player.vy <= 0) {
                                player.y = obj.y + BLOCK_SIZE; player.vy = 0; onSolid = true;
                            } else if (playerSolidBox.y < obj.y + BLOCK_SIZE && playerSolidBox.y + playerSolidBox.h > obj.y) {
                                if (!isGodMode) handlePlayerDeath();
                            }
                        }
                    }
                }
            }

            player.isGrounded = onSolid;

            if (player.mode === "ship") {
                player.isRotating = false;
                player.rotation = player.vy * 7.5 * player.gravitySign;
                if (player.rotation > 45) player.rotation = 45;
                if (player.rotation < -45) player.rotation = -45;
            } else {
                if (player.isGrounded) {
                    player.rotation = Math.round(player.rotation / 90) * 90;
                    player.isRotating = false;
                    if (player.jumpHold) {
                        player.vy = JUMP_IMPULSE * player.gravitySign;
                        player.isGrounded = false; player.isRotating = true;
                        player.rotTarget = player.rotation + 90 * player.gravitySign;
                    }
                } else {
                    if (player.isRotating) {
                        player.rotation += 2.14 * player.gravitySign;
                    }
                }
            }

            cameraX = player.x - 150;

            let playerDangerBox = { x: player.x + 6, y: player.y + 6, w: 12, h: 12 };
            if (player.mode === "ship") {
                playerDangerBox = { x: player.x + 10, y: player.y + 10, w: 4, h: 4 };
            }

            for (let i = 0; i < gameObjects.length; i++) {
                let obj = gameObjects[i];
                if (obj.type === 2) {
                    let spikeHitbox = { x: obj.x + 3, y: obj.y + 5, w: 24, h: 25 };
                    if (checkAABB(playerDangerBox, spikeHitbox) && !isGodMode) handlePlayerDeath();
                } else if (obj.type === 3) {
                    let sawHitbox = { x: obj.x + 6, y: obj.y + 6, w: 18, h: 18 };
                    if (checkAABB(playerDangerBox, sawHitbox) && !isGodMode) handlePlayerDeath();
                } else if (obj.type === 4) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) {
                        player.vy = -18.5 * player.gravitySign; player.isGrounded = false;
                        player.isRotating = true; player.rotTarget = player.rotation + 180 * player.gravitySign;
                        spawnBurstParticles(obj.x + 15, obj.y + 15, "#f1c40f");
                    }
                } else if (obj.type === 5) {
                    if (player.jumpHold && checkAABB(playerDangerBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) {
                        player.vy = -15.5 * player.gravitySign; player.isGrounded = false;
                        player.isRotating = true; player.rotTarget = player.rotation + 180 * player.gravitySign;
                        spawnBurstParticles(obj.x + 15, obj.y + 15, "#f1c40f");
                    }
                } else if (obj.type === 6) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) {
                        player.gravitySign = -player.gravitySign;
                        player.vy = 8.0 * player.gravitySign; player.isGrounded = false;
                        player.isRotating = true; player.rotTarget = player.rotation + 90 * player.gravitySign;
                        spawnBurstParticles(obj.x + 15, obj.y + 15, "#3498db");
                    }
                } else if (obj.type === 7) {
                    if (player.jumpHold && checkAABB(playerDangerBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) {
                        player.gravitySign = -player.gravitySign;
                        player.vy = 4.2 * player.gravitySign; player.isGrounded = false;
                        player.isRotating = true; player.rotTarget = player.rotation + 90 * player.gravitySign;
                        spawnBurstParticles(obj.x + 15, obj.y + 15, "#3498db");
                    }
                } else if (obj.type === 8) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) player.gravitySign = -1;
                } else if (obj.type === 9) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) player.gravitySign = 1;
                } else if (obj.type === 10) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) player.mode = "ship";
                } else if (obj.type === 11) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE, h: BLOCK_SIZE })) player.mode = "cube";
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= p.fade;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            renderGameGraphics();
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }
        function renderGameGraphics() {
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
            
            gameCtx.save();
            gameCtx.translate(-cameraX, 0);

            gameCtx.strokeStyle = "rgba(0,0,0,0.04)";
            gameCtx.lineWidth = 1;
            let startGridX = Math.floor(cameraX / BLOCK_SIZE) * BLOCK_SIZE;
            for (let x = startGridX; x < startGridX + gameCanvas.width + BLOCK_SIZE; x += BLOCK_SIZE) {
                gameCtx.beginPath(); gameCtx.moveTo(x, 0); gameCtx.lineTo(x, gameCanvas.height); gameCtx.stroke();
            }
            for (let y = 0; y < gameCanvas.height; y += BLOCK_SIZE) {
                gameCtx.beginPath(); gameCtx.moveTo(cameraX, y); gameCtx.lineTo(cameraX + gameCanvas.width, y); gameCtx.stroke();
            }

            gameCtx.strokeStyle = "#000000";
            gameCtx.lineWidth = 3;
            gameCtx.beginPath(); gameCtx.moveTo(cameraX, 480); gameCtx.lineTo(cameraX + gameCanvas.width, 480); gameCtx.stroke();

            gameObjects.forEach(obj => {
                drawObjectOnCanvas(gameCtx, obj);
            });

            particles.forEach(p => {
                gameCtx.save();
                gameCtx.globalAlpha = p.alpha;
                gameCtx.fillStyle = p.color;
                gameCtx.beginPath();
                gameCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                gameCtx.fill();
                gameCtx.restore();
            });

            gameCtx.save();
            gameCtx.translate(player.x + player.width / 2, player.y + player.height / 2);
            gameCtx.rotate((player.rotation * Math.PI) / 180);
            if (player.gravitySign === -1) {
                gameCtx.scale(1, -1);
            }
            
            if (player.mode === "ship") {
                gameCtx.fillStyle = "#000000";
                gameCtx.beginPath();
                gameCtx.moveTo(-14, -6);
                gameCtx.lineTo(14, 0);
                gameCtx.lineTo(-14, 8);
                gameCtx.closePath();
                gameCtx.fill();
                gameCtx.strokeStyle = "#ffffff";
                gameCtx.lineWidth = 1.5;
                gameCtx.stroke();
            } else {
                gameCtx.fillStyle = "#000000";
                gameCtx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                gameCtx.strokeStyle = "#ffffff";
                gameCtx.lineWidth = 2;
                gameCtx.strokeRect(-player.width / 2 + 3, -player.height / 2 + 3, player.width - 6, player.height - 6);
            }
            gameCtx.restore();

            gameCtx.restore();
        }

        function handlePlayerDeath() {
            player.x = 50;
            player.y = player.gravitySign === 1 ? 456 : 0;
            player.vy = 0;
            player.rotation = 0;
            player.isGrounded = true;
            player.isRotating = false;
        }

        function stopActualGame() {
            gameActive = false;
            if (gameLoopId) clearInterval(gameLoopId);
            window.removeEventListener("keydown", handleGameControls);
            window.removeEventListener("keyup", handleGameControlsUp);
            if (gameCanvas) gameCanvas.style.display = "none";
        }

        document.getElementById("editor-btn-left").addEventListener("click", () => switchScreen("editor"));
        document.getElementById("play-btn-center").addEventListener("click", () => switchScreen("play"));
        document.getElementById("dev-btn-right").addEventListener("click", () => alert("Пока еще в разработке..."));
        document.getElementById("exit-selector-btn").addEventListener("click", () => switchScreen("main-menu"));
        
        document.getElementById("editor-exit-btn").addEventListener("click", () => {
            stopActualGame();
            switchScreen("main-menu");
        });

        document.getElementById("editor-test-btn").addEventListener("click", () => {
            if (editorObjects.length === 0) {
                alert("Сначала постройте что-нибудь!");
                return;
            }
            startActualGame(editorObjects);
        });

        document.getElementById("editor-download-btn").addEventListener("click", () => {
            let lvlName = prompt("Введите название уровня:", "My Custom Level");
            if (!lvlName) return;
            let exportData = { id: localLevels.length + 1, name: lvlName, creator: "Admin", objects: editorObjects };
            localLevels.push(exportData);
            try {
                localStorage.setItem("gd_custom_levels", JSON.stringify(localLevels));
            } catch(e) { console.error(e); }
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "level.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert("Файл уровня скачан! Вы можете закинуть его в папку geometryd.");
        });

        const pauseOverlay = document.getElementById("editor-pause-overlay");
        const toggleGod = document.getElementById("toggle-god-mode");

        document.getElementById("editor-pause-btn").addEventListener("click", () => {
            document.getElementById("stat-obj-count").textContent = editorObjects.length;
            toggleGod.className = isGodMode ? "toggle-switch active" : "toggle-switch";
            pauseOverlay.style.display = "flex";
        });

        toggleGod.addEventListener("click", () => {
            isGodMode = !isGodMode;
            toggleGod.className = isGodMode ? "toggle-switch active" : "toggle-switch";
        });

        document.getElementById("editor-resume-btn").addEventListener("click", () => {
            pauseOverlay.style.display = "none";
        });

        document.getElementById("game-resume-btn").addEventListener("click", () => {
            document.getElementById("game-pause-overlay").style.display = "none";
            gameLoopId = setInterval(gameUpdateLoop, FRAME_TIME);
        });

        document.getElementById("game-exit-btn").addEventListener("click", () => {
            document.getElementById("game-pause-overlay").style.display = "none";
            stopActualGame();
        });

        const tabs = ["build", "edit", "delete"];
        tabs.forEach(tab => {
            document.getElementById(`tab-${tab}`).addEventListener("click", () => {
                tabs.forEach(t => {
                    document.getElementById(`tab-${t}`).classList.remove("active");
                    document.getElementById(`panel-${t}`).style.display = "none";
                });
                activeTab = tab;
                document.getElementById(`tab-${tab}`).classList.add("active");
                document.getElementById(`panel-${tab}`).style.display = "block";
                drawEditor();
            });
        });

        document.querySelectorAll(".palette-item").forEach(item => {
            item.addEventListener("click", () => {
                document.querySelectorAll(".palette-item").forEach(i => i.classList.remove("active"));
                item.classList.add("active");
                selectedBlockType = parseInt(item.getAttribute("data-type"), 10);
            });
        });

        initData();
        switchScreen("main-menu");
    </script>
</body>
</html>
