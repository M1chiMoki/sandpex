<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash — 240FPS Ultimate Scale Engine</title>
    <style>
        @font-face {
            font-family: 'Minecraftia';
            src: url('https://cdnfonts.com') format('woff');
            font-weight: normal; font-style: normal;
        }
        * { box-sizing: border-box; font-family: 'Minecraftia', sans-serif !important; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; }
        
        #gd-game-stage { width: 1600px; height: 900px; border: 5px solid #000000; position: relative; background: #ffffff; overflow: hidden; box-shadow: 0 15px 50px rgba(0,0,0,0.15); }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #main-menu-screen { display: flex; background: #ffffff; }
        
        .menu-title { font-size: 54px; font-weight: bold; margin-bottom: 60px; letter-spacing: 4px; text-transform: uppercase; text-shadow: 3px 3px 0px rgba(0,0,0,0.1); }
        .menu-buttons-container { display: flex; align-items: center; gap: 50px; position: relative; }
        
        .main-btn { background: #000000; color: #ffffff; border: 4px solid #000000; font-weight: bold; cursor: pointer; transition: 0.2s ease; display: flex; align-items: center; justify-content: center; text-align: center; }
        .main-btn:hover { background: #ffffff; color: #000000; }
        
        #play-btn-center { width: 240px; height: 240px; border-radius: 50%; font-size: 32px; text-transform: uppercase; }
        #editor-btn-left, #dev-btn-right { width: 140px; height: 140px; border-radius: 16px; font-size: 16px; text-transform: uppercase; }
        #dev-btn-right { background: #ffffff; color: #000000; }
        #dev-btn-right:hover { background: #000000; color: #ffffff; }
        
        #profile-btn-bottom-left { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 50px; font-size: 14px; text-transform: uppercase; z-index: 10; }
        #play-screen { background: #ffffff; }
        .level-selector-row { display: flex; align-items: center; justify-content: center; gap: 60px; width: 100%; height: 100%; position: relative; }
        .nav-arrow { width: 80px; height: 80px; border: 4px solid #000000; background: #ffffff; font-size: 32px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 12px; transition: 0.15s; z-index: 10; }
        .nav-arrow:hover { background: #000000; color: #ffffff; }
        .level-card { width: 600px; height: 400px; border: 5px solid #000000; border-radius: 16px; background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .level-card h3 { font-size: 36px; margin-bottom: 20px; text-transform: uppercase; }
        .level-card p { font-size: 18px; color: #555555; margin-bottom: 40px; }
        
        #editor-screen { background: #ffffff; flex-direction: row; align-items: stretch; padding: 0; }
        #editor-canvas { background: #fafafa; cursor: crosshair; }
        .editor-sidebar { width: 300px; border-left: 5px solid #000000; display: flex; flex-direction: column; background: #ffffff; padding: 20px; justify-content: space-between; }
        
        .editor-panel-box { background: #ffffff; border: 3px solid #000000; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .editor-tab-row { display: flex; gap: 6px; margin-bottom: 15px; border-bottom: 3px solid #000000; padding-bottom: 8px; }
        .tab-btn { flex: 1; padding: 10px 0; font-size: 14px; font-weight: bold; border: 3px solid #000000; background: #ffffff; cursor: pointer; text-transform: uppercase; text-align: center; border-radius: 6px; }
        .tab-btn.active { background: #000000; color: #ffffff; }
        
        .palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .palette-item { aspect-ratio: 1; border: 3px solid #000000; background: #ffffff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-radius: 6px; text-align: center; padding: 4px; text-transform: uppercase; }
        .palette-item.active { background: #eeeeee; box-shadow: inset 0 0 5px rgba(0,0,0,0.2); }
        .palette-item span { font-size: 20px; margin-bottom: 4px; }
        
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .action-btn { padding: 10px 0; font-size: 14px; font-weight: bold; border: 3px solid #000000; background: #ffffff; cursor: pointer; border-radius: 6px; text-transform: uppercase; text-align: center; }
        .action-btn:hover { background: #000000; color: #ffffff; }
        
        #editor-top-bar { position: absolute; top: 20px; left: 20px; display: flex; gap: 15px; z-index: 50; }
        .top-bar-btn { height: 50px; padding: 0 25px; font-size: 16px; font-weight: bold; border: 3px solid #000000; background: #ffffff; cursor: pointer; border-radius: 8px; text-transform: uppercase; display: flex; align-items: center; }
        .top-bar-btn:hover { background: #000000; color: #ffffff; }
        
        #editor-pause-overlay, #game-pause-overlay, #profile-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.96); z-index: 200; flex-direction: column; justify-content: center; align-items: center; border: 5px solid #000000; }
        #editor-pause-overlay h2, #game-pause-overlay h2, #profile-overlay h2 { font-size: 36px; margin-bottom: 30px; text-transform: uppercase; }
        .pause-box { border: 4px solid #000000; background: #fafafa; padding: 30px; border-radius: 12px; width: 500px; margin-bottom: 30px; }
        .pause-stat-line { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 12px; }
        
        .toggle-container { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; border-top: 2px dashed #000; padding-top: 15px; }
        .toggle-label { font-size: 16px; font-weight: bold; }
        .toggle-switch { width: 60px; height: 32px; background: #e0e0e0; border: 3px solid #000000; border-radius: 16px; position: relative; cursor: pointer; transition: 0.2s; }
        .toggle-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #000000; border-radius: 50%; transition: 0.2s; }
        .toggle-switch.active { background: #2ecc71; }
        .toggle-switch.active::after { left: 31px; background: #ffffff; }
        
        .scale-slider-container { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .scale-slider-label { font-size: 12px; font-weight: bold; color: #555555; text-transform: uppercase; }
        .scale-slider { width: 100%; height: 6px; background: #e0e0e0; border: 1px solid #000000; border-radius: 3px; outline: none; cursor: pointer; -webkit-appearance: none; }
        .scale-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #000000; border: 1px solid #ffffff; border-radius: 50%; cursor: pointer; }
        
        .hex-input-box { width: 100%; height: 36px; background: #ffffff; border: 2px solid #000000; border-radius: 4px; padding: 0 8px; font-size: 14px; font-weight: bold; outline: none; margin-top: 8px; }
        
        .target-toggle-row { display: flex; gap: 6px; margin-top: 10px; }
        .target-btn { flex: 1; padding: 6px; font-size: 11px; border: 2px solid #000000; background: #ffffff; cursor: pointer; border-radius: 4px; text-transform: uppercase; text-align: center; font-weight: bold; }
        .target-btn.active { background: #000000; color: #ffffff; }
    </style>
</head>
<body>

    <div id="gd-game-stage">
        <button class="main-btn" id="profile-btn-bottom-left" style="position:absolute; bottom:30px; left:30px; width:140px; height:50px; font-size:14px; text-transform:uppercase; z-index:1000;">Профиль</button>

        <div class="screen" id="main-menu-screen">
            <div class="menu-title">Geometry Dash</div>
            <div class="menu-buttons-container">
                <button class="main-btn" id="editor-btn-left">Редактор</button>
                <button class="main-btn" id="play-btn-center">Играть</button>
                <button class="main-btn" id="dev-btn-right">✕</button>
            </div>
        </div>

        <div class="screen" id="play-screen">
            <div id="editor-top-bar" style="top:20px; left:20px;">
                <button class="top-bar-btn" id="exit-selector-btn">◀ Меню</button>
            </div>
            <div class="level-selector-row">
                <button class="nav-arrow" id="prev-lvl-btn">◀</button>
                <div class="level-card" id="level-card-view"></div>
                <button class="nav-arrow" id="next-lvl-btn">▶</button>
            </div>
        </div>

        <div class="screen" id="editor-screen">
            <div id="editor-top-bar">
                <button class="top-bar-btn" id="editor-test-btn">▶ Тест</button>
                <button class="top-bar-btn" id="editor-download-btn">⬇ Скачать</button>
                <button class="top-bar-btn" id="editor-exit-btn">◀ Выйти</button>
            </div>
            <div style="position:absolute; top:20px; right:325px; z-index:50;">
                <button class="top-bar-btn" id="editor-pause-btn">⏸</button>
            </div>
            <canvas id="editor-canvas" width="1300" height="900"></canvas>
            <div class="editor-sidebar">
                <div>
                    <div class="editor-tab-row">
                        <button class="tab-btn active" id="tab-build">Build</button>
                        <button class="tab-btn" id="tab-edit">Edit</button>
                        <button class="tab-btn" id="tab-delete">Delete</button>
                    </div>
                    
                    <div class="editor-panel-box" id="panel-build" style="max-height: 480px; overflow-y: auto;">
                        <div class="palette-grid">
                            <button class="palette-item active" data-type="1"><span>⬜</span>Блок</button>
                            <button class="palette-item" data-type="15"><span>▅</span>П.Блок</button>
                            <button class="palette-item" data-type="2"><span>▲</span>Шип</button>
                            <button class="palette-item" data-type="3"><span>⚙</span>Пила</button>
                            <button class="palette-item" data-type="4"><span>▬</span>Ж.Пад</button>
                            <button class="palette-item" data-type="5"><span>〇</span>Ж.Орб</button>
                            <button class="palette-item" data-type="6"><span>▬</span>С.Пад</button>
                            <button class="palette-item" data-type="7"><span>〇</span>С.Орб</button>
                            <button class="palette-item" data-type="8"><span>⧉</span>Ж.Порт</button>
                            <button class="palette-item" data-type="9"><span>⧉</span>С.Порт</button>
                            <button class="palette-item" data-type="10"><span>⧉</span>Р.Порт</button>
                            <button class="palette-item" data-type="11"><span>⧉</span>З.Порт</button>
                            <button class="palette-item" data-type="12"><span>⧉</span>В.Порт</button>
                            <button class="palette-item" data-type="16"><span>🄿</span>D Блок</button>
                            <button class="palette-item" data-type="13"><span>🚩</span>S.Pos</button>
                            <button class="palette-item" data-type="14"><span>🏁</span>End</button>
                        </div>
                    </div>
                    
                    <div class="editor-panel-box" id="panel-edit" style="display:none;">
                        <div class="action-grid">
                            <button class="action-btn" id="act-copy">Copy</button>
                            <button class="action-btn" id="act-paste">Paste</button>
                            <button class="action-btn" id="act-copypaste" style="font-size:12px;">Copy+Paste</button>
                            <button class="action-btn" id="act-kill-toggle" style="background:#2ecc71; color:#fff; border-color:#2ecc71;">Kill: ON</button>
                        </div>
                        
                        <div class="target-toggle-row">
                            <button class="target-btn active" id="target-outline">Outline</button>
                            <button class="target-btn" id="target-inside">Inside</button>
                        </div>
                        <input type="text" id="hex-color-input" class="hex-input-box" placeholder="#000000" maxlength="7">
                        
                        <div class="scale-slider-container">
                            <span class="scale-slider-label">Scale: <span id="scale-slider-val">1.0</span></span>
                            <input type="range" id="obj-scale-slider" class="scale-slider" min="0.5" max="3" step="0.1" value="1">
                        </div>
                        
                        <div class="scale-slider-container" style="margin-top:10px;">
                            <span class="scale-slider-label">Opacity: <span id="opacity-slider-val">100%</span></span>
                            <input type="range" id="obj-opacity-slider" class="scale-slider" min="0" max="1" step="0.1" value="1">
                        </div>
                    </div>

                    <div class="editor-panel-box" id="panel-delete" style="display:none;">
                        <p style="font-size:12px; text-align:center; color:#555; padding:15px 0;">Кликните на объект для удаления</p>
                    </div>
                </div>
                
                <div class="editor-panel-box" style="margin-bottom:0;">
                    <div class="stat-label" id="brush-mode-txt">Кисть: Single (TAB)</div>
                    <div style="font-size:12px; color:#333; line-height:1.4; margin-top:6px;">SHIFT + Мышь: Рамка<br>CTRL + Мышь: Без сетки</div>
                </div>
            </div>
        </div>
        <div id="profile-overlay">
            <h2>Профиль Игрока</h2>
            <div class="pause-box">
                <div style="margin-bottom:15px;">
                    <label class="scale-slider-label">Цвет Иконки (Обводка) HEX:</label>
                    <input type="text" id="prof-out-color" class="hex-input-box" value="#ffffff" maxlength="7">
                </div>
                <div style="margin-bottom:15px;">
                    <label class="scale-slider-label">Цвет Иконки (Внутри) HEX:</label>
                    <input type="text" id="prof-in-color" class="hex-input-box" value="#000000" maxlength="7">
                </div>
                <div style="margin-bottom:15px;">
                    <label class="scale-slider-label">Цвет Вспышек / Эффектов HEX:</label>
                    <input type="text" id="prof-fx-color" class="hex-input-box" value="#f1c40f" maxlength="7">
                </div>
                <div>
                    <label class="scale-slider-label">Цвет Шлейфа Волны HEX:</label>
                    <input type="text" id="prof-trail-color" class="hex-input-box" value="#3498db" maxlength="7">
                </div>
            </div>
            <button class="btn" id="profile-close-btn" style="width:250px; font-size:16px; padding:12px;">Сохранить</button>
        </div>

        <div id="editor-pause-overlay">
            <h2>Настройки редактора</h2>
            <div class="pause-box">
                <div class="pause-stat-line"><span>Всего объектов:</span><span id="stat-obj-count">0</span></div>
                <div class="toggle-container">
                    <span class="toggle-label">Бессмертие (God Mode)</span>
                    <div class="toggle-switch" id="toggle-god-mode"></div>
                </div>
                <div class="toggle-container">
                    <span class="toggle-label">Отображать хитбоксы</span>
                    <div class="toggle-switch" id="toggle-show-hitboxes"></div>
                </div>
            </div>
            <button class="btn" id="editor-resume-btn" style="width:250px; font-size:16px; padding:12px;">Продолжить</button>
        </div>

        <div id="game-pause-overlay">
            <h2>Пауза уровня</h2>
            <button class="btn" id="game-resume-btn" style="width:250px; margin-bottom:12px; font-size:16px; padding:12px;">Продолжить</button>
            <button class="btn" id="game-restart-btn" style="width:250px; margin-bottom:12px; background:#f1c40f; border-color:#f1c40f; color:#000; font-size:16px; padding:12px;">Рестарт</button>
            <button class="btn" id="game-exit-btn" style="width:250px; background:#e74c3c; border-color:#e74c3c; font-size:16px; padding:12px;">Выйти</button>
        </div>
    </div>

    <script>
        const BLOCK_SIZE = 30;
        const FPS = 240;
        const FRAME_TIME = 1000 / FPS;

        let currentScreen = "main-menu";
        let isGodMode = false;
        let showHitboxes = false;
        let localLevels = [];
        let currentLevelIdx = 0;
        
        let editorObjects = [];
        let activeTab = "build";
        let selectedBlockType = 1;
        let selectedObjectForEdit = null;
        let clipboardObject = null;
        let editTargetLayer = "outline";
        
        let gameActive = false;
        let gameObjects = [];
        let particles = [];
        let waveTrail = [];
        let padCooldown = false;
        let brushMode = "single";
        
        let profileSettings = {
            outline: "#ffffff",
            inside: "#000000",
            fx: "#f1c40f",
            trail: "#3498db"
        };
        
        let editorScrollX = 0;
        let editorScrollY = 0;
        let isEditorPanning = false;
        let editorPanStartX = 0;
        let editorPanStartY = 0;
        let isMoreBuilding = false;
        
        let selectionStartX = 0;
        let selectionStartY = 0;
        let isSelectionBoxActive = false;
        let selectionCurrentX = 0;
        let selectionCurrentY = 0;
        let selectedObjectsGroup = [];
        let isCtrlPressed = false;
        let isShiftPressed = false;
        let dragStartMouseX = 0;
        let dragStartMouseY = 0;
        let isDraggingGroup = false;

        let player = { 
            x: 50, y: 690, vx: 1.625, vy: 0, rotation: 0, width: 30, height: 30, 
            isGrounded: false, jumpHold: false, isRotating: false, rotTarget: 0,
            gravitySign: 1, mode: "cube", isSliding: false
        };
        let cameraX = 0;
        
        let GRAVITY = 0.101;
        const JUMP_IMPULSE = -4.125;
        const MAX_FALL_SPEED = 5.5;

        const legendsColors = ["#ffffff", "#000000", "#e74c3c", "#9b59b6", "#3498db", "#e67e22", "#1abc9c", "#f1c40f", "#2ecc71"];
        function initData() {
            try {
                let saved = localStorage.getItem("gd_custom_levels");
                if (saved) localLevels = JSON.parse(saved);
                let savedProf = localStorage.getItem("gd_player_profile");
                if (savedProf) profileSettings = JSON.parse(savedProf);
            } catch(e) { console.log(e); }
            if (localLevels.length === 0) {
                localLevels = [];
            }
            document.getElementById("prof-out-color").value = profileSettings.outline;
            document.getElementById("prof-in-color").value = profileSettings.inside;
            document.getElementById("prof-fx-color").value = profileSettings.fx;
            document.getElementById("prof-trail-color").value = profileSettings.trail;
        }

        const menuScreen = document.getElementById("main-menu-screen");
        const playScreen = document.getElementById("play-screen");
        const editorScreen = document.getElementById("editor-screen");
        const levelCardView = document.getElementById("level-card-view");
        const editorCanvas = document.getElementById("editor-canvas");
        const editorCtx = editorCanvas.getContext("2d");

        function switchScreen(screenName) {
            currentScreen = screenName;
            menuScreen.style.display = "none";
            playScreen.style.display = "none";
            editorScreen.style.display = "none";
            if (screenName === "main-menu") {
                menuScreen.style.display = "flex";
            } else if (screenName === "play") {
                playScreen.style.display = "flex";
                renderLevelCard();
            } else if (screenName === "editor") {
                editorScreen.style.display = "flex";
                resizeEditorCanvas();
                drawEditor();
            }
        }

        function renderLevelCard() {
            if (localLevels.length === 0 || currentLevelIdx < 0 || currentLevelIdx >= localLevels.length) {
                levelCardView.innerHTML = `<h3>Скоро...</h3><p style="font-size:14px;margin-top:10px;">Новые испытания в разработке</p>`;
                return;
            }
            let lvl = localLevels[currentLevelIdx];
            levelCardView.innerHTML = `
                <h3>${lvl.name}</h3>
                <p>Создатель: ${lvl.creator}<br>Объектов: ${lvl.objects.length}</p>
                <button class="btn" id="start-level-game-btn" style="width:200px;font-size:16px;padding:12px;">СТАРТ</button>
            `;
            document.getElementById("start-level-game-btn").addEventListener("click", () => {
                startActualGame(lvl.objects);
            });
        }

        document.getElementById("prev-lvl-btn").addEventListener("click", () => {
            if (localLevels.length === 0) return;
            if (currentLevelIdx > 0) { currentLevelIdx--; renderLevelCard(); }
            else { levelCardView.innerHTML = `<h3>Скоро...</h3><p style="font-size:14px;margin-top:10px;">Конец списка уровней</p>`; }
        });

        document.getElementById("next-lvl-btn").addEventListener("click", () => {
            if (localLevels.length === 0) return;
            if (currentLevelIdx < localLevels.length - 1) { currentLevelIdx++; renderLevelCard(); }
            else { currentLevelIdx = localLevels.length; levelCardView.innerHTML = `<h3>Скоро...</h3><p style="font-size:14px;margin-top:10px;">Конец списка уровней</p>`; }
        });

        function resizeEditorCanvas() {
            editorCanvas.width = 1300;
            editorCanvas.height = 900;
        }

        function drawEditor() {
            editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
            editorCtx.save();
            editorCtx.translate(editorScrollX, editorScrollY);

            editorCtx.strokeStyle = "rgba(0,0,0,0.06)";
            editorCtx.lineWidth = 1;
            let startX = Math.floor(-editorScrollX / BLOCK_SIZE) * BLOCK_SIZE;
            let startY = Math.floor(-editorScrollY / BLOCK_SIZE) * BLOCK_SIZE;
            
            for (let x = startX; x < startX + editorCanvas.width + BLOCK_SIZE; x += BLOCK_SIZE) {
                editorCtx.beginPath(); editorCtx.moveTo(x, startY); editorCtx.lineTo(x, startY + editorCanvas.height + BLOCK_SIZE); editorCtx.stroke();
            }
            for (let y = startY; y < startY + editorCanvas.height + BLOCK_SIZE; y += BLOCK_SIZE) {
                editorCtx.beginPath(); editorCtx.moveTo(startX, y); editorCtx.lineTo(startX + editorCanvas.width + BLOCK_SIZE, y); editorCtx.stroke();
            }

            editorCtx.strokeStyle = "#000000";
            editorCtx.lineWidth = 4;
            editorCtx.beginPath(); editorCtx.moveTo(-editorScrollX, 720); editorCtx.lineTo(-editorScrollX + editorCanvas.width, 720); editorCtx.stroke();

            editorObjects.forEach(obj => {
                drawObjectOnCanvas(editorCtx, obj, true);
                let sizeMult = obj.scale || 1;
                if ((activeTab === "edit" && selectedObjectForEdit === obj) || selectedObjectsGroup.includes(obj)) {
                    editorCtx.strokeStyle = "#ff003c"; editorCtx.lineWidth = 3;
                    let w = obj.type === 3 ? BLOCK_SIZE * 2 : BLOCK_SIZE;
                    let h = (obj.type >= 8 && obj.type <= 12) ? BLOCK_SIZE * 3 : (obj.type === 15 ? BLOCK_SIZE / 2 : (obj.type === 3 ? BLOCK_SIZE * 2 : BLOCK_SIZE));
                    editorCtx.strokeRect(obj.x, obj.y, w * sizeMult, h * sizeMult);
                }
            });

            if (isSelectionBoxActive) {
                editorCtx.strokeStyle = "rgba(52, 152, 219, 0.8)";
                editorCtx.lineWidth = 2;
                editorCtx.fillStyle = "rgba(52, 152, 219, 0.1)";
                editorCtx.fillRect(selectionStartX, selectionStartY, selectionCurrentX - selectionStartX, selectionCurrentY - selectionStartY);
                editorCtx.strokeRect(selectionStartX, selectionStartY, selectionCurrentX - selectionStartX, selectionCurrentY - selectionStartY);
            }
            editorCtx.restore();
        }
        function drawObjectOnCanvas(ctx, canvasObj, isEditorMode) {
            let outlineCol = canvasObj.color || "#ffffff";
            let insideCol = canvasObj.fillColor || "#000000";
            let scaleVal = canvasObj.scale || 1;
            let opacityVal = canvasObj.opacity !== undefined ? canvasObj.opacity : 1;
            
            ctx.save();
            ctx.globalAlpha = opacityVal;
            ctx.translate(canvasObj.x, canvasObj.y);
            ctx.scale(scaleVal, scaleVal);

            if (canvasObj.type === 1) {

                ctx.strokeStyle = outlineCol; ctx.lineWidth = 3; ctx.strokeRect(0, 0, BLOCK_SIZE, BLOCK_SIZE);
            } else if (canvasObj.type === 15) {

            } else if (canvasObj.type === 2) {
                ctx.beginPath(); ctx.moveTo(0, BLOCK_SIZE); ctx.lineTo(BLOCK_SIZE / 2, 0); ctx.lineTo(BLOCK_SIZE, BLOCK_SIZE); ctx.closePath();
                ctx.fillStyle = insideCol; ctx.fill(); ctx.strokeStyle = outlineCol; ctx.lineWidth = 3; ctx.stroke();
            } else if (canvasObj.type === 3) {
                ctx.save();
                ctx.translate(BLOCK_SIZE, BLOCK_SIZE);
                if (!isEditorMode && gameActive) {
                    ctx.rotate((Date.now() % 1000) / 1000 * Math.PI * 2);
                }
                ctx.beginPath();
                for (let i = 0; i < 16; i++) {
                    let angle = (i / 16) * Math.PI * 2;
                    let r = (i % 2 === 0) ? BLOCK_SIZE - 2 : BLOCK_SIZE - 8;
                    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fillStyle = insideCol; ctx.fill();
                ctx.strokeStyle = outlineCol; ctx.lineWidth = 3; ctx.stroke();
                
                ctx.strokeStyle = outlineCol; ctx.lineWidth = 1.5;
                for (let i = 0; i < 8; i++) {

                ctx.fillStyle = insideCol; ctx.fill(); ctx.stroke();

            } else if (canvasObj.type === 4) {

            } else if (canvasObj.type === 5) {

                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
            } else if (canvasObj.type === 6) {

            } else if (canvasObj.type === 7) {

                ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
            } else if (canvasObj.type === 8) {
                ctx.fillStyle = "rgba(241, 196, 15, 0.3)"; ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
                ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
            } else if (canvasObj.type === 9) {
                ctx.fillStyle = "rgba(52, 152, 219, 0.3)"; ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
                ctx.strokeStyle = "#3498db"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
            } else if (canvasObj.type === 10) {
                ctx.fillStyle = "rgba(255, 107, 129, 0.3)"; ctx.fillRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
                ctx.strokeStyle = "#ff6b81"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
            } else if (canvasObj.type === 11) {

                ctx.strokeStyle = "#2ecc71"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, BLOCK_SIZE, BLOCK_SIZE * 3);
            } else if (canvasObj.type === 12) {
                ctx.fillStyle = "rgba(155, 89, 182, 0.3)";
                ctx.beginPath(); ctx.moveTo(BLOCK_SIZE / 2, 0); ctx.lineTo(BLOCK_SIZE, BLOCK_SIZE * 1.5); ctx.lineTo(BLOCK_SIZE / 2, BLOCK_SIZE * 3); ctx.lineTo(0, BLOCK_SIZE * 1.5); ctx.closePath(); ctx.fill();

        editorCanvas.addEventListener("mousedown", e => {
            const rect = editorCanvas.getBoundingClientRect();

            const mouseY = e.clientY - rect.top - editorScrollY;
            
            const cellX = Math.floor(mouseX / BLOCK_SIZE) * BLOCK_SIZE;
            const cellY = Math.floor(mouseY / BLOCK_SIZE) * BLOCK_SIZE;
            
            dragStartMouseX = e.clientX;
            dragStartMouseY = e.clientY;

            if (activeTab === "build") {
                if (brushMode === "single") {
                    let clickedObj = editorObjects.find(o => o.x === cellX && o.y === cellY);
                    if (!clickedObj) {
                        isEditorPanning = true;
                        editorPanStartX = e.clientX - editorScrollX;
                        editorPanStartY = e.clientY - editorScrollY;
                    } else {
                        let existingIndex = editorObjects.indexOf(clickedObj);
                        editorObjects.splice(existingIndex, 1);
                        editorObjects.push({ type: selectedBlockType, x: cellX, y: cellY, color: "#ffffff", fillColor: "#000000", scale: 1, opacity: 1, kill: true });

            } else if (activeTab === "edit") {

                        let s = o.scale || 1;
                        return mouseX >= o.x && mouseX <= o.x + w * s && mouseY >= o.y && mouseY <= o.y + h * s;
                    });

        function resetPlayerState(startPos) {
            player = { 
                x: startPos ? startPos.x : 50, 
                y: startPos ? startPos.y : 690, 
                vx: 1.625, vy: 0, rotation: 0, width: 30, height: 30, 
                isGrounded: true, jumpHold: player.jumpHold || false, isRotating: false, rotTarget: 0,
                gravitySign: 1, mode: "cube", isSliding: false
            };

        function handleGameControls(e) {
            if (e.key === " " || e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
                player.jumpHold = true;

        function gameUpdateLoop() {
            player.x += player.vx;
            
            if (player.mode === "wave") {
                if (player.isSliding) {
                    player.vy = 0;
                    player.rotation = 0;
                } else {
                    player.vy = player.jumpHold ? -player.vx * player.gravitySign : player.vx * player.gravitySign;
                    player.rotation = player.jumpHold ? -45 * player.gravitySign : 45 * player.gravitySign;
                }
                waveTrail.push({ x: player.x + player.width - 1.3, y: player.y + player.height / 2 });
                if (waveTrail.length > 800) waveTrail.shift();
            } else if (player.mode === "ship") {
                let thrust = player.jumpHold ? -0.105 * player.gravitySign : 0.105 * player.gravitySign;
                player.vy += thrust;
                let cap = 1.75;
                if (player.vy > cap) player.vy = cap;
                if (player.vy < -cap) player.vy = -cap;
                
                if (Math.random() < 0.3) {
                    particles.push({
                        type: "smoke", x: player.x, y: player.y + player.height / 2 + (Math.random() - 0.5) * 8,
                        vx: -1 - Math.random() * 1, vy: (Math.random() - 0.5) * 0.4,
                        size: 4 + Math.random() * 5, alpha: 0.8, fade: 0.015 + Math.random() * 0.015, color: "#95a5a6"
                    });
                }
            } else {
                player.vy += GRAVITY * player.gravitySign;
                if (player.gravitySign === 1 && player.vy > MAX_FALL_SPEED) player.vy = MAX_FALL_SPEED;
                if (player.gravitySign === -1 && player.vy < -MAX_FALL_SPEED) player.vy = -MAX_FALL_SPEED;
            }
            
            if (player.mode !== "wave") {
                player.y += player.vy;
            } else {
                player.y += player.vy;
            }

            let onSolid = false;
            let currentCeiling = 0;
            let currentFloor = 690;
            
            if (player.gravitySign === 1 && player.y >= currentFloor) {
                player.y = currentFloor; player.vy = 0; onSolid = true;
                if (player.mode === "wave") player.isSliding = true;
            } else if (player.gravitySign === -1 && player.y <= currentCeiling) {
                player.y = currentCeiling; player.vy = 0; onSolid = true;
                if (player.mode === "wave") player.isSliding = true;
            } else {
                if (player.mode === "wave") player.isSliding = false;
            }
            let playerSolidBox = { x: player.x, y: player.y, w: player.width, h: player.height };
            if (player.mode === "ship") {
                playerSolidBox = { x: player.x + 16, y: player.y + 7, w: 28, h: 15 };
            } else if (player.mode === "wave") {
                playerSolidBox = { x: player.x + player.width - 2.6, y: player.y + player.height / 2 - 1.3, w: 2.6, h: 2.6 };
            }

            let hasDBloakActive = false;

            for (let i = 0; i < gameObjects.length; i++) {
                let obj = gameObjects[i];
                if (obj.kill === false) continue;
                let s = obj.scale || 1;

                if (obj.type === 16) {
                    let dBox = { x: obj.x - 2, y: obj.y - 2, w: BLOCK_SIZE * s + 4, h: BLOCK_SIZE * s + 4 };
                    if (checkAABB(playerSolidBox, dBox)) {
                        hasDBloakActive = true;
                    }
                }
            }

            for (let i = 0; i < gameObjects.length; i++) {
                let obj = gameObjects[i];
                if (obj.kill === false) continue;
                let s = obj.scale || 1;
                
                if (obj.type === 1 || obj.type === 15) {
                    let bW = BLOCK_SIZE * s;
                    let bH = (obj.type === 15 ? BLOCK_SIZE / 2 : BLOCK_SIZE) * s;
                    
                    if (playerSolidBox.x + playerSolidBox.w > obj.x && playerSolidBox.x < obj.x + bW) {
                        if (player.gravitySign === 1) {
                            if (playerSolidBox.y + playerSolidBox.h >= obj.y && playerSolidBox.y + playerSolidBox.h <= obj.y + 10 && player.vy >= 0) {
                                player.y = obj.y - player.height; player.vy = 0; onSolid = true;
                                if (player.mode === "wave") player.isSliding = true;
                            } else if (playerSolidBox.y < obj.y + bH && playerSolidBox.y + playerSolidBox.h > obj.y) {
                                if (player.mode === "wave") {
                                    if (!hasDBloakActive && !isGodMode) handlePlayerDeath();
                                } else {
                                    if (!isGodMode) handlePlayerDeath();
                                }
                            }
                        } else {
                            if (playerSolidBox.y <= obj.y + bH && playerSolidBox.y >= obj.y + bH - 10 && player.vy <= 0) {
                                player.y = obj.y + bH; player.vy = 0; onSolid = true;
                                if (player.mode === "wave") player.isSliding = true;
                            } else if (playerSolidBox.y < obj.y + bH && playerSolidBox.y + playerSolidBox.h > obj.y) {
                                if (player.mode === "wave") {
                                    if (!hasDBloakActive && !isGodMode) handlePlayerDeath();
                                } else {
                                    if (!isGodMode) handlePlayerDeath();
                                }
                            }
                        }
                    }
                }
            }

            if (player.mode === "wave" && onSolid && hasDBloakActive) {
                player.isSliding = true;
            } else if (player.mode === "wave" && !onSolid) {
                if (player.y > 0 && player.y < 690) {
                    player.isSliding = false;
                }
            }

            player.isGrounded = onSolid;

            if (player.mode === "cube") {
                if (player.isGrounded) {
                    player.rotation = Math.round(player.rotation / 90) * 90;
                    player.isRotating = false;
                    if (player.jumpHold) {
                        player.vy = JUMP_IMPULSE * player.gravitySign;
                        player.isGrounded = false; player.isRotating = true;
                        player.rotTarget = player.rotation + 90 * player.gravitySign;
                    }
                } else {
                    player.rotation += 0.535 * player.gravitySign;
                }
            } else if (player.mode === "ship" && !player.isGrounded) {
                player.rotation = player.vy * 26 * player.gravitySign;
                if (player.rotation > 45) player.rotation = 45;
                if (player.rotation < -45) player.rotation = -45;
            }

            cameraX = player.x - 300;
            let playerDangerBox = { x: player.x + 9, y: player.y + 9, w: 12, h: 12 };
            if (player.mode === "ship") {
                playerDangerBox = { x: player.x + 26, y: player.y + 11, w: 8, h: 8 };
            } else if (player.mode === "wave") {
                playerDangerBox = { x: player.x + player.width - 2.6, y: player.y + player.height / 2 - 1.3, w: 2.6, h: 2.6 };
            }

            let hitAnyPad = false;

            for (let i = 0; i < gameObjects.length; i++) {
                let obj = gameObjects[i];
                if (obj.kill === false) continue;
                let s = obj.scale || 1;
                
                if (obj.type >= 8 && obj.type <= 12) {
                    if (Math.random() < 0.2) {
                        let pColor = profileSettings.fx;
                        if (obj.type === 9) pColor = "#3498db";
                        if (obj.type === 10) pColor = "#ff6b81";
                        if (obj.type === 11) pColor = "#2ecc71";
                        if (obj.type === 12) pColor = "#9b59b6";
                        particles.push({
                            type: "ambient", x: obj.x + Math.random() * (BLOCK_SIZE * s), y: obj.y + Math.random() * (BLOCK_SIZE * 3 * s),
                            vx: (Math.random() - 0.5) * 1, vy: -0.4 - Math.random() * 0.6,
                            size: 2 + Math.random() * 2.5, alpha: 0.9, fade: 0.005 + Math.random() * 0.005, color: pColor
                        });
                    }
                }

                if (obj.type === 4 || obj.type === 5 || obj.type === 6 || obj.type === 7) {
                    if (Math.random() < 0.05) {
                        let pColor = (obj.type === 4 || obj.type === 5) ? profileSettings.fx : "#3498db";
                        let angle = Math.random() * Math.PI * 2;
                        let radius = (obj.type === 4 || obj.type === 6) ? 15 : 10;
                        particles.push({
                            type: "ambient", x: obj.x + (BLOCK_SIZE * s) / 2 + Math.cos(angle) * radius, y: obj.y + (BLOCK_SIZE * s) / 2 + Math.sin(angle) * radius,
                            vx: Math.cos(angle) * 0.1, vy: Math.sin(angle) * 0.1,
                            size: 1.5 + Math.random() * 2, alpha: 0.8, fade: 0.003 + Math.random() * 0.003, color: pColor
                        });
                    }
                }

                if (obj.type === 2) {
                    let spikeHitbox = { x: obj.x + 3 * s, y: obj.y + 6 * s, w: 24 * s, h: 24 * s };
                    if (checkAABB(playerDangerBox, spikeHitbox) && !isGodMode) handlePlayerDeath();
                } else if (obj.type === 3) {
                    let sawHitbox = { x: obj.x + 6 * s, y: obj.y + 6 * s, w: 48 * s, h: 48 * s };
                    if (checkAABB(playerDangerBox, sawHitbox) && !isGodMode) handlePlayerDeath();
                } else if (obj.type === 4) {
                    let padH = (obj.type === 15 ? BLOCK_SIZE / 2 : BLOCK_SIZE) * s;
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y + padH - 6, w: BLOCK_SIZE * s, h: 6 })) {
                        hitAnyPad = true;
                        if (!padCooldown) {
                            player.vy = -5.375 * player.gravitySign; player.isGrounded = false;
                            if (player.mode === "cube") { player.isRotating = true; player.rotTarget = player.rotation + 180 * player.gravitySign; }
                            spawnBurstParticles(obj.x + 15 * s, obj.y + 15 * s, profileSettings.fx);
                            padCooldown = true;
                        }
                    }
                } else if (obj.type === 5) {
                    if (player.jumpHold && checkAABB(playerDangerBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * s })) {
                        player.vy = -4.625 * player.gravitySign; player.isGrounded = false;
                        if (player.mode === "cube") { player.isRotating = true; player.rotTarget = player.rotation + 180 * player.gravitySign; }
                        spawnBurstParticles(obj.x + 15 * s, obj.y + 15 * s, profileSettings.fx);
                        player.jumpHold = false;
                    }
                } else if (obj.type === 6) {
                    let padH = (obj.type === 15 ? BLOCK_SIZE / 2 : BLOCK_SIZE) * s;
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y + padH - 6, w: BLOCK_SIZE * s, h: 6 })) {
                        hitAnyPad = true;
                        if (!padCooldown) {
                            player.gravitySign = -player.gravitySign;
                            player.vy = 2.375 * player.gravitySign; player.isGrounded = false;
                            if (player.mode === "cube") { player.isRotating = true; player.rotTarget = player.rotation + 90 * player.gravitySign; }
                            spawnBurstParticles(obj.x + 15 * s, obj.y + 15 * s, "#3498db");
                            padCooldown = true;
                        }
                    }
                } else if (obj.type === 7) {
                    if (player.jumpHold && checkAABB(playerDangerBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * s })) {
                        player.gravitySign = -player.gravitySign;
                        player.vy = 1.3 * player.gravitySign; player.isGrounded = false;
                        if (player.mode === "cube") { player.isRotating = true; player.rotTarget = player.rotation + 90 * player.gravitySign; }
                        spawnBurstParticles(obj.x + 15 * s, obj.y + 15 * s, "#3498db");
                        player.jumpHold = false;
                    }
                } else if (obj.type === 8) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * 3 * s })) player.gravitySign = -1;
                } else if (obj.type === 9) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * 3 * s })) player.gravitySign = 1;
                } else if (obj.type === 10) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * 3 * s })) player.mode = "ship";
                } else if (obj.type === 11) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * 3 * s })) player.mode = "cube";
                } else if (obj.type === 12) {
                    if (checkAABB(playerSolidBox, { x: obj.x, y: obj.y, w: BLOCK_SIZE * s, h: BLOCK_SIZE * 3 * s })) player.mode = "wave";
                } else if (obj.type === 14) {
                    if (player.x + player.width > obj.x) {
                        clearInterval(gameLoopId);
                        alert("Уровень пройден успешно!");
                        stopActualGame();
                        return;
                    }
                }
            }

            if (!hitAnyPad) {
                padCooldown = false;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= p.fade;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            renderGameGraphics();
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }
        function renderGameGraphics() {
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
            gameCtx.save(); gameCtx.translate(-cameraX, 0);
            gameCtx.strokeStyle = "rgba(0,0,0,0.04)"; gameCtx.lineWidth = 1;
            let startGridX = Math.floor(cameraX / BLOCK_SIZE) * BLOCK_SIZE;
            for (let x = startGridX; x < startGridX + gameCanvas.width + BLOCK_SIZE; x += BLOCK_SIZE) {
                gameCtx.beginPath(); gameCtx.moveTo(x, 0); gameCtx.lineTo(x, gameCanvas.height); gameCtx.stroke();
            }
            for (let y = 0; y < gameCanvas.height; y += BLOCK_SIZE) {
                gameCtx.beginPath(); gameCtx.moveTo(cameraX, y); gameCtx.lineTo(cameraX + gameCanvas.width, y); gameCtx.stroke();
            }
            gameCtx.strokeStyle = "#000000"; gameCtx.lineWidth = 4;
            gameCtx.beginPath(); gameCtx.moveTo(cameraX, 720); gameCtx.lineTo(cameraX + gameCanvas.width, 720); gameCtx.stroke();

            if (player.mode === "wave" && waveTrail.length > 1) {
                gameCtx.save();
                gameCtx.strokeStyle = profileSettings.trail;
                gameCtx.lineWidth = 4;
                gameCtx.beginPath();
                gameCtx.moveTo(waveTrail[0].x, waveTrail[0].y);
                for (let i = 1; i < waveTrail.length; i++) {
                    gameCtx.lineTo(waveTrail[i].x, waveTrail[i].y);
                }
                gameCtx.stroke();
                gameCtx.restore();
            }

            gameObjects.forEach(obj => { 
                drawObjectOnCanvas(gameCtx, obj, false); 
                if (showHitboxes) {
                    let s = obj.scale || 1;
                    if (obj.kill !== false) {
                        if (obj.type === 1) {
                            gameCtx.strokeStyle = "#2ecc71"; gameCtx.lineWidth = 2;
                            gameCtx.strokeRect(obj.x, obj.y, BLOCK_SIZE * s, BLOCK_SIZE * s);
                        } else if (obj.type === 15) {
                            gameCtx.strokeStyle = "#2ecc71"; gameCtx.lineWidth = 2;
                            gameCtx.strokeRect(obj.x, obj.y, BLOCK_SIZE * s, (BLOCK_SIZE / 2) * s);
                        } else if (obj.type === 2) {
                            gameCtx.strokeStyle = "#e74c3c"; gameCtx.lineWidth = 2;
                            gameCtx.strokeRect(obj.x + 3 * s, obj.y + 6 * s, 24 * s, 24 * s);
                        } else if (obj.type === 3) {
                            gameCtx.strokeStyle = "#e74c3c"; gameCtx.lineWidth = 2;
                            gameCtx.strokeRect(obj.x + 6 * s, obj.y + 6 * s, 48 * s, 48 * s);
                        }
                    }
                }
            });

            particles.forEach(p => {
                gameCtx.save(); gameCtx.globalAlpha = p.alpha; gameCtx.fillStyle = p.color;
                gameCtx.beginPath(); gameCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); gameCtx.fill(); gameCtx.restore();
            });

            gameCtx.save();
            gameCtx.translate(player.x + player.width / 2, player.y + player.height / 2);
            gameCtx.rotate((player.rotation * Math.PI) / 180);
            if (player.gravitySign === -1) gameCtx.scale(1, -1);
            
            if (player.mode === "ship") {
                gameCtx.fillStyle = profileSettings.inside; gameCtx.strokeStyle = profileSettings.outline; gameCtx.lineWidth = 2;
                gameCtx.beginPath(); gameCtx.moveTo(30, 0); gameCtx.lineTo(-10, -10); gameCtx.lineTo(-30, -10); gameCtx.lineTo(-30, 8); gameCtx.lineTo(-20, 15); gameCtx.lineTo(4, 8); gameCtx.closePath(); gameCtx.fill(); gameCtx.stroke();
                gameCtx.fillStyle = "#ffffff"; gameCtx.beginPath(); gameCtx.moveTo(8, -2); gameCtx.lineTo(-4, -5); gameCtx.lineTo(-12, -2); gameCtx.closePath(); gameCtx.fill();
                gameCtx.fillStyle = profileSettings.inside; gameCtx.beginPath(); gameCtx.moveTo(-12, -10); gameCtx.lineTo(-24, -25); gameCtx.lineTo(-28, -25); gameCtx.lineTo(-22, -10); gameCtx.closePath(); gameCtx.fill(); gameCtx.stroke();
                gameCtx.beginPath(); gameCtx.moveTo(-8, 4); gameCtx.lineTo(-24, 10); gameCtx.lineTo(-20, 14); gameCtx.lineTo(-4, 6); gameCtx.closePath(); gameCtx.fill(); gameCtx.stroke();
                
                gameCtx.fillStyle = profileSettings.inside; gameCtx.fillRect(-12, -5, 12, 12); gameCtx.strokeStyle = profileSettings.outline; gameCtx.lineWidth = 1.5; gameCtx.strokeRect(-10, -3, 8, 8);
            } else if (player.mode === "wave") {
                gameCtx.fillStyle = profileSettings.inside; gameCtx.strokeStyle = profileSettings.outline; gameCtx.lineWidth = 2.5;
                gameCtx.beginPath(); gameCtx.moveTo(player.width / 2, 0); gameCtx.lineTo(-player.width / 2, -player.height / 2); gameCtx.lineTo(-player.width / 4, 0); gameCtx.lineTo(-player.width / 2, player.height / 2); gameCtx.closePath(); gameCtx.fill(); gameCtx.stroke();
            } else {
                gameCtx.fillStyle = profileSettings.inside; gameCtx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
                gameCtx.strokeStyle = profileSettings.outline; gameCtx.lineWidth = 3; gameCtx.strokeRect(-player.width / 2 + 4, -player.height / 2 + 4, player.width - 8, player.height - 8);
            }
            gameCtx.restore(); 

            if (showHitboxes) {
                gameCtx.strokeStyle = "#2ecc71"; gameCtx.lineWidth = 2;
                if (player.mode === "ship") gameCtx.strokeRect(player.x + 16, player.y + 7, 28, 15);
                else if (player.mode === "cube") gameCtx.strokeRect(player.x, player.y, player.width, player.height);
                gameCtx.strokeStyle = "#e74c3c";
                if (player.mode === "ship") gameCtx.strokeRect(player.x + 26, player.y + 11, 8, 8);
                else if (player.mode === "wave") gameCtx.strokeRect(player.x + player.width - 2.6, player.y + player.height / 2 - 1.3, 2.6, 2.6);
                else gameCtx.strokeRect(player.x + 9, player.y + 9, 12, 12);
            }
            gameCtx.restore();
        }
        function handlePlayerDeath() {
            let startPosObj = gameObjects.find(o => o.type === 13);
            player.x = startPosObj ? startPosObj.x : 50;
            player.y = startPosObj ? startPosObj.y : (player.gravitySign === 1 ? 690 : 0);
            player.vy = 0; player.rotation = 0; player.isGrounded = true; player.isRotating = false;
            waveTrail = [];
        }

        function stopActualGame() {
            gameActive = false;
            if (gameLoopId) clearInterval(gameLoopId);
            window.removeEventListener("keydown", handleGameControls);
            window.removeEventListener("keyup", handleGameControlsUp);
            if (gameCanvas) gameCanvas.style.display = "none";
        }

        document.getElementById("editor-btn-left").addEventListener("click", () => switchScreen("editor"));
        document.getElementById("play-btn-center").addEventListener("click", () => switchScreen("play"));
        document.getElementById("dev-btn-right").addEventListener("click", () => alert("Пока еще в разработке..."));
        document.getElementById("exit-selector-btn").addEventListener("click", () => switchScreen("main-menu"));
        document.getElementById("editor-exit-btn").addEventListener("click", () => { stopActualGame(); switchScreen("main-menu"); });

        document.getElementById("editor-test-btn").addEventListener("click", () => {
            if (editorObjects.length === 0) { alert("Сначала постройте что-нибудь!"); return; }
            startActualGame(editorObjects);
        });

        document.getElementById("editor-download-btn").addEventListener("click", () => {
            let lvlName = prompt("Введите название уровня:", "My Custom Level");
            if (!lvlName) return;
            let exportData = { id: localLevels.length + 1, name: lvlName, creator: "Admin", objects: editorObjects };
            localLevels.push(exportData);
            try { localStorage.setItem("gd_custom_levels", JSON.stringify(localLevels)); } catch(e) { console.error(e); }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", "level.json");
            document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
            alert("Файл уровня скачан! Вы можете закинуть его в папку geometryd.");
        });

        const pauseOverlay = document.getElementById("editor-pause-overlay");
        const toggleGod = document.getElementById("toggle-god-mode");
        const toggleHitboxes = document.getElementById("toggle-show-hitboxes");

        document.getElementById("editor-pause-btn").addEventListener("click", () => {
            document.getElementById("stat-obj-count").textContent = editorObjects.length;
            toggleGod.className = isGodMode ? "toggle-switch active" : "toggle-switch";
            toggleHitboxes.className = showHitboxes ? "toggle-switch active" : "toggle-switch";
            pauseOverlay.style.display = "flex";
        });

        toggleGod.addEventListener("click", () => { isGodMode = !isGodMode; toggleGod.className = isGodMode ? "toggle-switch active" : "toggle-switch"; });
        toggleHitboxes.addEventListener("click", () => { showHitboxes = !showHitboxes; toggleHitboxes.className = showHitboxes ? "toggle-switch active" : "toggle-switch"; });
        document.getElementById("editor-resume-btn").addEventListener("click", () => { pauseOverlay.style.display = "none"; });
        
        document.getElementById("game-resume-btn").addEventListener("click", () => {
            document.getElementById("game-pause-overlay").style.display = "none";
            gameLoopId = setInterval(gameUpdateLoop, FRAME_TIME);
        });
        document.getElementById("game-restart-btn").addEventListener("click", () => {
            document.getElementById("game-pause-overlay").style.display = "none";
            let startPosObj = gameObjects.find(o => o.type === 13);
            resetPlayerState(startPosObj);
            particles = []; waveTrail = [];
            gameLoopId = setInterval(gameUpdateLoop, FRAME_TIME);
        });
        document.getElementById("game-exit-btn").addEventListener("click", () => {
            document.getElementById("game-pause-overlay").style.display = "none"; stopActualGame();
        });

        const profOverlay = document.getElementById("profile-overlay");
        document.getElementById("profile-btn-bottom-left").addEventListener("click", () => {
            profOverlay.style.display = "flex";
        });
        document.getElementById("profile-close-btn").addEventListener("click", () => {
            profileSettings.outline = document.getElementById("prof-out-color").value;
            profileSettings.inside = document.getElementById("prof-in-color").value;
            profileSettings.fx = document.getElementById("prof-fx-color").value;
            profileSettings.trail = document.getElementById("prof-trail-color").value;
            try { localStorage.setItem("gd_player_profile", JSON.stringify(profileSettings)); } catch(e) {}
            profOverlay.style.display = "none";
        });

        initData();
        switchScreen("main-menu");
    </script>
</body>
</html>
